<script id="jobs-data" type="application/json">[{"id": "FILE-80aa840e3c0b409c7d2b25e7", "organization": "Buildots", "title": "Technical Product", "a": 4, "b": 2, "alternative": false, "description": "*About Buildots*\n\nBuildots is the world’s most advanced construction intelligence platform. By comparing schedules and BIM against site reality, its advanced AI transforms granular data into insights that unlock operational excellence.\n\nFortune 500 contractors and owners trust Buildots, including HOCHTIEF, Bouygues, Intel, NCC and VINCI Construction. Its impact is proven at every scale, from multi-family projects to multi-gigawatt data centers.\n\nWith over $160M raised and major expansion planned for 2026, this is a unique opportunity to join a fast-scaling company reshaping one of the world’s largest industries.\n\n*About the role*\n\nThe truth is that behind almost any cutting-edge AI system, there are dozens of moving parts that work together to process the raw data. Buildots is no different, behind our slick dashboards there’s an extremely complex analysis architecture that includes AI models, classic algorithms, 3D rendering, and more, all working together at scale to turn our clients’ visual data into valuable insights.\n\nWe are looking for a process-oriented technical product manager, to define, design, and lead implementation for the various components of our analysis engine.\n\n*What you'll do:*\n\n* Lead highly complex technical product features as part of the company’s product team.\n* Take part in defining the company’s roadmap, taking into account the needs from multiple clients.\n* Work closely with the algorithms team to define and oversee the development of AI and Computer Vision research tasks\n* Work closely with the engineering team to implement processes, features, and research deliverables into the analysis process\n* Be the operations team’s point of contact for improving the data processing, validation, and delivery procedures\n* Research directions for new data sources, technologies or client needs, making sure we maintain our competitive edge\n* Be part of a vibrant team of bright product leaders bringing the construction industry into the digital age\n\n*Requirements:*\n\n* At least 4 years of experience as a software developer / 3 years of technical experience + B.Sc in Computer Science or equivalent\n* Ability to define a big picture, and derive smaller & achievable goals from it\n* Familiarity with computer vision algorithms or/and deep neural networks - advantage\n* A problem solver – highly inventive thinker that will provide insightful, innovative solutions to any problem\n* Ability to thrive in a fast-paced startup working environment\n* Construction / BIM environment and 3D modeling software experience - advantage\n* Pro-active and independent achiever, self-learner, able to handle a task from idea to production\n* Good vibes and a sense of humor - must\n\nDon’t let the job description (or imposter syndrome) intimidate you – if this role sparks your interest, we’d love to see your application, even if you don’t meet every single requirement.\n\n*To support our hiring process, we may leverage AI-powered tools for tasks such as application screening, resume analysis, and response evaluation. All decisions remain under the oversight of our recruitment team.\n\n*By submitting your application, you agree that Buildots will process your personal data in accordance with Buildots' Privacy Policy.\n\nRequirements\n------------\n\n* At least 4 years of experience as a software developer / 3 years of technical experience + B.Sc in Computer Science or equivalent\n* Ability to define a big picture, and derive smaller & achievable goals from it\n* Familiarity with computer vision algorithms or/and deep neural networks - advantage\n* A problem solver – highly inventive thinker that will provide insightful, innovative solutions to any problem\n* Ability to thrive in a fast-paced startup working environment\n* Construction / BIM environment and 3D modeling software experience - advantage\n* Pro-active and independent achiever, self-learner, able to handle a task from idea to production", "language": "en", "documents": [{"url": "cv/5d4d8337e379aca61132616bce540c1f32b555e9c869020c147938f93b8c838b.pdf", "filename": "Yehuda_Raanan_Buildots_Technical_Product_CV.pdf", "kind": "other", "primary": true}]}, {"id": "FILE-MATRIX-76748", "organization": "Matrix DnA", "title": "Head of AI Product Management", "a": 4, "b": 3, "alternative": false, "description": "- Establish and lead an AI product capability and team.\n- Define product vision, strategy, and roadmaps.\n- Improve enterprise processes through AI.\n- Lead products end to end from idea through launch, adoption, and impact measurement.\n- Work across senior management, business stakeholders, and technology teams.\n- Main requirements: 5+ years in product management including team leadership, digital transformation,\n  complex enterprise processes, and business-to-product translation.", "language": "en", "documents": [{"url": "cv/90ff7cc09d8f88066c79eafafbfbfec39ce809f546a8022af2b357514ddba530.pdf", "filename": "Yehuda_Raanan_Matrix_Head_AI_Product_CV.pdf", "kind": "other", "primary": true}]}, {"id": "FILE-MATRIX-78334", "organization": "Matrix DnA", "title": "Data Product Lead", "a": 4, "b": 3, "alternative": false, "description": "- Lead a Data product in a security-sector context.\n- Prepare specifications and a product roadmap.\n- Main requirements: 3 years of Data product management and security-sector background.\n- Team leadership is preferred.", "language": "en", "documents": [{"url": "cv/7c605be23e0352d3da9f647a45f1087de843e700e9e0208116c3fb2733abc38b.pdf", "filename": "Yehuda_Raanan_Matrix_DnA_Product_Delivery_CV.pdf", "kind": "other", "primary": true}]}, {"id": "FILE-MATRIX-78426", "organization": "Matrix DnA", "title": "Data Domain Manager", "a": 3, "b": 3, "alternative": false, "description": "- Manage and professionally guide development teams and develop talent.\n- Deliver DWH and analytical-information solutions end to end, including integration and structured and\n  unstructured information.\n- Own solution architecture and projects from specification through development and production.\n- Coordinate business, technology, and vendors and manage plans, budgets, resources, and priorities.\n- Promote Data and AI innovation.\n- Main requirements: 10+ years in BI, Data, DWH, or enterprise information and 5+ years managing\n  development teams and managers, including teams of 15+.", "language": "en", "documents": [{"url": "cv/7c605be23e0352d3da9f647a45f1087de843e700e9e0208116c3fb2733abc38b.pdf", "filename": "Yehuda_Raanan_Matrix_DnA_Product_Delivery_CV.pdf", "kind": "other", "primary": true}]}, {"id": "FILE-MATRIX-78601", "organization": "Matrix DnA", "title": "Data Architect, Pre-Sales and Customer Solutions", "a": 4, "b": 3, "alternative": false, "description": "- Work across customers and business units in presales and advanced Data-solution design.\n- Translate needs into on-premises or cloud Data architecture and business value.\n- Identify opportunities and support expansion of existing activity.\n- Lead architectural advisory through the lifecycle, including workshops, presentations, and senior stakeholders.\n- Collaborate with Data Engineering, BI, Data Science, cloud, development, and project-management teams.\n- Main requirements: significant Data Architect experience, presales and customer work, Data Lake, DWH,\n  modern Data architecture, and strong communication. Cloud is an advantage.", "language": "en", "documents": [{"url": "cv/ee931e6ede1770dd8b6b5cebe7fc50e32921b847e01ed8ac44f3a1803bf0626c.pdf", "filename": "Yehuda_Raanan_Matrix_DnA_Data_Architecture_CV.pdf", "kind": "other", "primary": true}]}, {"id": "FILE-MATRIX-78727", "organization": "Matrix DnA", "title": "Senior Data Project Manager", "a": 3, "b": 4, "alternative": false, "description": "- Lead complex cross-organizational initiatives in information systems, Data, and innovation.\n- Work end to end with IT, Data, vendors, and business units.\n- Main requirements: 5+ years managing complex projects, business and technology interfaces, Data and\n  integration understanding, and influence without authority.", "language": "en", "documents": [{"url": "cv/7c605be23e0352d3da9f647a45f1087de843e700e9e0208116c3fb2733abc38b.pdf", "filename": "Yehuda_Raanan_Matrix_DnA_Product_Delivery_CV.pdf", "kind": "other", "primary": true}]}, {"id": "FILE-MATRIX-78761", "organization": "Matrix DnA", "title": "Data Analytics Architect / Principal Data Engineer", "a": 3, "b": 3, "alternative": false, "description": "The official title and body are not fully aligned. The body describes a BI and Data section-management role.\n\n- Manage development teams and managers.\n- Deliver DWH and analytical-information solutions end to end.\n- Own architecture, cross-organizational technology projects, plans, budgets, and Data and AI innovation.\n- Main requirements: 10+ years in BI, Data, or DWH and 5+ years managing development teams and managers.", "language": "en", "documents": [{"url": "cv/ee931e6ede1770dd8b6b5cebe7fc50e32921b847e01ed8ac44f3a1803bf0626c.pdf", "filename": "Yehuda_Raanan_Matrix_DnA_Data_Architecture_CV.pdf", "kind": "other", "primary": true}]}, {"id": "FILE-MATRIX-78870", "organization": "Matrix DnA", "title": "Data and AI Project Manager", "a": 4, "b": 4, "alternative": false, "description": "- Lead national, cross-cutting Data and AI initiatives in a government organization.\n- Improve information reliability, currency, availability, and completeness.\n- Advance Data culture, organizational maturity, analytics, AI, operating models, training, and adoption.\n- Manage requirements and several concurrent projects across BI, DWH, Data Lake, and ETL environments.\n- Coordinate budgets, schedules, vendors, architecture, cloud, and senior stakeholders.\n- Main requirements include Data and AI portfolio leadership, budgeting and schedules, business analysis,\n  BI, DWH, Data Lake and ETL familiarity, matrix delivery, vendors, and Agile, Scrum, or Waterfall.", "language": "en", "documents": [{"url": "cv/7c605be23e0352d3da9f647a45f1087de843e700e9e0208116c3fb2733abc38b.pdf", "filename": "Yehuda_Raanan_Matrix_DnA_Product_Delivery_CV.pdf", "kind": "other", "primary": true}]}, {"id": "FILE-MATRIX-79200", "organization": "Matrix DnA", "title": "BI and ETL Development Team Lead", "a": 3, "b": 2, "alternative": false, "description": "User supplied the complete posting text on 2026-09-27.\n\n- Lead professionally and work on BI solutions, ETL processes, reports, and advanced Data infrastructure.\n- Main requirements: 7+ years of relevant development experience and 5+ years of ETL development in BI.\n- Integrate data from structured and unstructured sources and different database types.\n- Significant Tableau, SAS, or equivalent reporting experience.\n- High SQL proficiency and experience in data modeling and specification.\n- Informatica Developer, SingleStore, and SAS are significant advantages.", "language": "en", "documents": [{"url": "cv/ee931e6ede1770dd8b6b5cebe7fc50e32921b847e01ed8ac44f3a1803bf0626c.pdf", "filename": "Yehuda_Raanan_Matrix_DnA_Data_Architecture_CV.pdf", "kind": "other", "primary": true}]}, {"id": "FILE-MATRIX-79203", "organization": "Matrix DnA", "title": "Senior Data Engineer and Strategic Consultant", "a": 4, "b": 2, "alternative": false, "description": "User supplied the complete posting text on 2026-09-27.\n\n- Strategic and technical role planning and leading Data architectures, infrastructure, and complex Data\n  processes in BI and AI environments.\n- Main requirements: 8+ relevant BI years and 5+ recent years as a Data Engineer.\n- Design and implement DWH and Data Lake architectures.\n- Design, establish, and lead Data pipelines and work with BI systems and DWH models.\n- Very strong SQL and ETL design and implementation using Informatica or equivalent tools.\n- AI architecture familiarity.\n- Python, AI tools, Data Governance, Data Quality, production Tableau, and establishment or management of\n  Data environments are significant advantages.", "language": "en", "documents": [{"url": "cv/ee931e6ede1770dd8b6b5cebe7fc50e32921b847e01ed8ac44f3a1803bf0626c.pdf", "filename": "Yehuda_Raanan_Matrix_DnA_Data_Architecture_CV.pdf", "kind": "other", "primary": true}]}, {"id": "J-02ad85a0071bbbad5fb9937d", "organization": "Dream", "title": "Senior Applied AI Researcher, Sovereign AI Research", "a": 5, "b": 3, "alternative": false, "description": "# Dream — Senior Applied AI Researcher, Sovereign AI Research\n\n## About the position\n\nEvery nation has data. Few can protect it. Fewer still can act on it.\n\nDream is the sovereign AI and national cyber-defense company for governments.\n\nWe help nations secure their most critical systems, connect fragmented information at a national scale, and turn their most sensitive data into decisions, all fully sovereign.\n\nThis is more than a job. It's a Dream job, where you'll work at a global scale alongside some of the best AI researchers, cyber operators, and government experts in the world.\n\nWe're building AI that nations own and control, deployed where almost no one else can operate, ingesting and structuring complex data, and driving practical actions that can literally impact the lives of billions of people around the world. This role helps make that real.\n\n## The Dream Job\n\nNations are waking up to a hard truth: critical intelligence infrastructure built on hyperscaler black boxes isn't a solution; it's a dependency. The DREAM Sovereign AI Research Group exists to answer that differently.\n\nWe're not fine-tuning what already exists. We're rethinking the models architecture from the ground up: modular, composable, and built with compute governance as a first-class design constraint, not an afterthought.\n\nWe operate under real-world constraints. The interesting problems live at the intersections of disciplines. That's where we operate.\n\nThis is a hands-on research role embedded within a team of senior researchers. Day to day includes training models, running benchmarks, and synthesizing data. The researchers you'll work alongside will challenge you technically and invest in your growth.\n\n## Open research tracks\n\nFamiliarity with at least one is expected:\n\n- Computer Vision: object detection, segmentation, multimodal grounding, vision-language models, contrastive and self-supervised representation learning, low-resource and few-shot visual recognition.\n- NLP / Speech: LLMs, NERs, relation extraction, span-based and generative IE, semantic textual similarity, multilingual and cross-lingual transfer.\n- Reinforcement Learning: MDPs, POMDPs, model-based and model-free RL, online/offline methods, reward modeling, sim-to-real transfer, compute-aware planning.\n- Graph Learning: GNNs, graph clustering, community structure, generative methods, knowledge graph embeddings, dense and sparse semantic retrieval.\n- Optimization: convex and nonconvex optimization, constrained and Lagrangian methods, combinatorial and integer programming, knowledge distillation (response, feature, and relation-based), test-time optimization, Bayesian optimization, resource-aware inference.\n- Representation Learning: contrastive learning, self-supervised and unsupervised pre-training, disentangled representations, metric learning and embedding spaces, cross-modal and multimodal alignment, meta learning (hypernetworks), transfer learning and domain adaptation, probing and interpretability of learned representations, world models.\n- Neurosymbolic AI: neuro-symbolic integration, differentiable theorem proving, inductive logic programming (ILP), probabilistic soft logic (PSL), causal inference and structural causal models (SCMs), programmatic and compositional reasoning.\n\n## Responsibilities\n\n- Train and evaluate models across research tracks, iterating fast while documenting rigorously.\n- Build and maintain benchmarking pipelines and evaluation suites.\n- Curate, structure, and preprocess datasets; contribute to synthetic data generation workflows.\n- Run ablations and controlled experiments to support research hypotheses.\n- Reproduce and stress-test results from recent literature relevant to the group's work.\n- Collaborate across tracks and with engineering teams through to production handoff.\n\n## Skill set\n\n- MSc in Computer Science, Electrical Engineering, or Mathematics.\n- Strong academic record with hands-on experience / thesis research.\n- Proficiency in Python and at least one deep learning framework (PyTorch preferred).\n- Comfort with the full data lifecycle: sourcing, structuring, cleaning, and transforming raw data into training-ready assets.\n\nWe work on hard problems where data is scarce and labels are noisy. We expect researchers who don't wait for better conditions, who will reformulate the problem when needed, devise novel strategies to generate or simulate data, and find signal where others see noise. If your instinct when blocked is to push harder rather than halt, you'll thrive here.\n\n## Never Stop Dreaming\n\nIf you think this role doesn't fully match your skills but are eager to grow and break glass ceilings, we’d love to hear from you.", "language": "en", "documents": [{"url": "cv/709fea2ef90d81a2501df2abd7e42ca4670fa70f711c9687ce53f8d7e9a75f7a.pdf", "filename": "Yehuda_Raanan_Dream_Senior_Applied_AI_Researcher_CV.pdf", "kind": "annotated", "primary": true}, {"url": "cv/10ad3fd7714dfec610bccf0cfc0aa5b0fda47aa430a1479cd455dd832be1b4c7.pdf", "filename": "Yehuda_Raanan_Dream_Senior_Applied_AI_Researcher_CV_Clean.pdf", "kind": "clean", "primary": true}]}, {"id": "J-0693b187210b04694e7c17bb", "organization": "Tipalti", "title": "Applied AI Scientist", "a": 5, "b": 3, "alternative": false, "description": "# Applied AI Scientist — Tipalti\n\n## Position summary\n\nWe're hiring an exceptional Applied AI Scientist to join our team.\n\nIn this role, you'll design and deploy enterprise-grade AI agents that drive real business impact across core functions: Sales, Marketing, Customer Success, Customer Support, Risk, and Finance. You'll build agentic systems that execute complex, multi-step business workflows end to end. The ideal candidate is a hands-on builder with deep AI expertise who thrives on turning complex business problems into reliable, production-grade AI systems.\n\n## Responsibilities\n\n- Enterprise AI Agent Development: Design, build, and deploy AI agents that automate and augment high-value workflows across business functions, including lead qualification and outreach (Sales and Marketing), churn reduction (Customer Success), and ticket deflection (Support).\n- Agentic Architecture and Orchestration: Own the end-to-end agent stack, including tool use, memory management, multi-step planning, and human-in-the-loop workflows.\n\nThe pasted source ends after “human-in-the-loop”; any omitted continuation is not part of the controlling position snapshot.\n\n## Requirements\n\n- Bachelor's degree in Computer Science, Engineering, or a related field, with a focus on AI.\n- 3+ years of hands-on experience in AI/ML engineering, ideally within fintech or a related sector, with a track record of deploying AI agents or agentic workflows in production.\n- Proficiency in Python and SQL for data manipulation, analysis, and AI system building.\n- Deep experience with LLMs and prompt engineering, including systematic evaluation of enterprise AI solutions.\n- Experience building RAG systems and conversational chatbots is an advantage.\n- Experience with cloud platforms (AWS preferred) for deployment and AI-Ops practices.\n- Analytical mindset: strong statistical reasoning and business acumen, with the ability to critically assess AI solutions and their real-world impact.\n- Project management: ability to manage and prioritize multiple tasks, balance short- and long-term goals, and deliver timely, high-impact results.", "language": "en", "documents": [{"url": "cv/5f47a6910db9528a3ab8f8dac85089fe385942ca855eeafceca94db58fcea2c4.pdf", "filename": "Yehuda_Raanan_Tipalti_Applied_AI_Scientist_CV.pdf", "kind": "other", "primary": true}]}, {"id": "J-079aa5622968df5e37b7b40a", "organization": "Riskified", "title": "Staff Data Scientist, Identity", "a": 5, "b": 2, "alternative": false, "description": "# Riskified — Staff Data Scientist, Identity\n\n## Company context\n\nRiskified helps ecommerce businesses manage chargeback, fraud, and policy-abuse risk and improve customer retention. Its AI-powered fraud and risk intelligence platform provides real-time decisions and identity-based insights. Customers named in the posting include Booking.com, Acer, Gucci, Lorna Jane, and GoPro.\n\nRiskified describes a collaborative culture focused on building products with lasting impact. The company has 750+ employees globally, and the Tel Aviv team works in a hybrid remote/in-office model.\n\n## About the role\n\nThe Data Science department builds production-grade algorithmic solutions at large scale. The Staff Data Scientist on the Identity team will drive the innovation roadmap for the Identity Graph Engine and architect, research, and deploy machine-learning models spanning graph neural networks, transformers, and deep tabular architectures for entity resolution and fraud prevention.\n\n## Responsibilities\n\n- Drive the next generation of the Identity Graph Engine with graph models, transformers, and machine-learning techniques.\n- Define the identity-resolution research roadmap, set technical standards, and guide complex research from concept to high-throughput production systems.\n- Build scalable predictive and representation-learning models over large tabular, sequence, and graph-structured datasets.\n- Collaborate with Data Engineering, Core Software, and Product to integrate complex ML pipelines into real-time production environments.\n- Benchmark and adapt current academic research to business problems while mentoring senior data scientists on modern modeling approaches.\n\n## Qualifications\n\n- M.Sc. or Ph.D. in Computer Science, Statistics, Mathematics, or a related quantitative field.\n- 6+ years designing, training, and deploying complex ML models in large-scale production environments.\n- Proven expertise with Transformers, DNNs, GNNs, or advanced tabular-learning architectures.\n- Strong practical experience with distributed data processing such as Spark or Databricks and with graph databases or frameworks.\n- Technical leadership, architectural direction, and translation of complex business requirements into high-impact algorithmic solutions.\n\n## Advantages\n\n- Fraud detection, risk management, or fintech experience.\n- Identity resolution, entity disambiguation, link analysis, or complex network modeling experience.", "language": "en", "documents": [{"url": "cv/4daf932f61fa965d5b5dc196276c9c86450e55201c51def5aacbd86190099ef2.pdf", "filename": "Yehuda_Raanan_Riskified_Staff_Data_Scientist_Identity_CV.pdf", "kind": "annotated", "primary": true}, {"url": "cv/c31365b6ff8bc17416d8064cda9a4a6f718f9f8f0cb1cf18c46f2743be1c4635.pdf", "filename": "Yehuda_Raanan_Riskified_Staff_Data_Scientist_Identity_CV_Clean.pdf", "kind": "clean", "primary": true}]}, {"id": "J-14e6f2167e435bd292ecd299", "organization": "Matrix", "title": "Credit and Finance Expert", "a": 4, "b": 3, "alternative": false, "description": "# Controlling position\n\nCompany: Matrix\n\nRole: Credit and Finance Expert\n\n## Purpose\n\n- Work directly with clients from private and business finance, funding, and credit sectors.\n- Understand client business needs and processes and shape tailored information-system solutions.\n- Serve as the professional authority in finance and credit.\n- Lead client meetings, define business requirements, and guide product, implementation, and development\n  teams from business need to working solution.\n\n## Requirements\n\n- Certified CPA, required.\n- 5+ years in credit, finance, or funding, required.\n- Finance and credit experience from a bank, credit company, non-bank financial company, or other financial\n  institution.\n- Deep understanding of private or business finance, accounting, and relevant regulation.\n- Familiarity with core financial systems. Tafnit is an advantage.\n- Ability to lead professional client meetings and present solutions.\n- Ability to translate business needs into processes and solutions.\n- Experience with information systems, product teams, or implementation processes.\n\n## Interpretation boundary\n\nThe role is primarily a domain-authority and client-solution role, not a pure risk-modeling or technology\nleadership role. Candidate evidence must connect finance and credit expertise with business analysis,\ninformation-system implementation, and client-facing delivery. Tafnit experience is not verified and must\nremain an explicit gap.", "language": "en", "documents": [{"url": "cv/9f4242a585847601e8a4e9788a826afd9ecd5bb1c522e047b47c4eebfdfb75ba.pdf", "filename": "Yehuda_Raanan_Matrix_Credit_Finance_Expert_CV.pdf", "kind": "annotated", "primary": true}, {"url": "cv/892e9b5bd25ccecda4b5bdff7dd7a0b457b855647ea233d2c40769846b3d8911.pdf", "filename": "Yehuda_Raanan_Matrix_Credit_Finance_Expert_CV_Clean.pdf", "kind": "clean", "primary": true}]}, {"id": "J-1709839602f940e47ad119d9", "organization": "Pagaya", "title": "Data Science Group Lead", "a": 4, "b": 3, "alternative": false, "description": "About Pagaya\nPagaya is a global technology company making life-changing financial products and services available to more people nationwide, as it reshapes the financial services ecosystem. By using machine learning, a vast data network and a sophisticated AI-driven approach, Pagaya provides comprehensive consumer credit and residential real estate solutions for its partners, their customers, and investors. Its proprietary API and capital solutions integrate into its network of partners to deliver seamless user experiences and greater access to the mainstream economy. Pagaya has offices in New York and Tel Aviv. For more information, visit pagaya.com.\nAbout the Role\nThe Group Lead is a critical leadership position within Pagaya. This role involves managing a high-performing group responsible for driving profitability and strategic decision-making through advanced data analytics, optimization strategies, and predictive modeling related to loan funding and issuance (specifically in the Personal Loans product, which is Pagaya’s largest product).\nThis is primarily a management-focused role, requiring a high level of technical understanding to guide the team, combined with the professional maturity and executive presence necessary to effectively collaborate with and present to company leadership.\nResponsibilities\nLeading, mentoring and managing a multidisciplinary group comprising Data Scientists, Data Analysts and Optimization Specialists.\nDefining and executing overall strategy, ensuring alignment with the company’s financial goals and product roadmap.\nOversighting of the group's projects, initiating new ideas and proactively improving the company’s abilities.\nFostering a culture of data-driven decision-making, continuous learning, and high-velocity iteration within the team.\nDirecting the team in performing sophisticated data analytics to identify trends, market anomalies, and segmentation opportunities impacting profitability.\nLeading the development and implementation of optimization algorithms and strategies aimed at maximizing loan portfolio performance, minimizing risk, and increasing overall profitability.\nTranslating complex data insights into clear, actionable business recommendations for partnerships and operational teams, to ensure seamless integration of data-driven solutions.\nServing as the primary representative of the group, presenting complex findings, strategic recommendations, and group performance metrics to the company's executive team and other departments.\nGuiding the development, validation, and deployment of advanced predictive models to enhance performance.\nRequirements\n8+ years professional experience in Data Science or Data Analytics, preferably within FinTech.\nProven experience 5+ years managing and mentoring multidisciplinary teams of Data Scientists and Analysts in a fast-paced environment.\nHigh-level understanding of statistical modeling, machine learning techniques, and optimization algorithms.\nMaster's degree or Ph.D. in a quantitative field such as Data Science, Statistics, Mathematics, Operations Research, or Computer Science.\nDescent knowledge in programming languages (e.g., Python) and databases (SQL). Experience with cloud computing environments is a plus.\nAn authoritative leader who navigates high-stakes environments with strategic maturity and exceptional communication.\nOur Team\nPagaya was founded in 2016 by seasoned research, finance, and technology entrepreneurs, and we are now 500+ strong in New York, Los Angeles, and Tel Aviv.\nWe move fast and smart, identifying new opportunities and building end-to-end solutions from AI models and unique data sources. Every Pagaya team member is solving new and exciting challenges every day in a culture based on partnership, collaboration, and community.\nJoin a team of builders who are working every day to enable better outcomes for our partners and their customers.\nOur Values\nOur values are at the heart of everything we do. We believe great solutions are built through a great community.\nAdvance Inclusion- We create a world where everyone can win, designing systems that better represent people and generate sustainable value for our employees, partners and investors.\nBe Accountable Together- We proudly own our actions and our results, taking initiative to ensure our work gets over the finish line as a team.\nContinuously Learn- We challenge ourselves for the sake of getting better as individuals, as teams, and as an organization to deliver for our partners.\nDebate and Commit- We respectfully and openly debate to strengthen our ideas and build shared conviction - once we decide, we go all in, together.\nDream Big and Act- We boldly tackle complex problems, pressure-test solutions in real-time, and adapt with speed and energy.\nMore than just a job\nWe believe health, happiness, and productivity go hand-in-hand. That's why we're continually looking to enhance the ways we support you with benefits programs and perks that allow every Pagayan to do the best work of their life.\nPagaya is an equal opportunity employer. Pagaya is encouraging diversity and actively seeking applicants from all backgrounds, as are committed to creating a diverse workforce together with an inclusive environment for all. Employment is decided on the basis of qualifications, skills, and business needs.\nhttps://pagaya.com/privacy-policy", "language": "en", "documents": [{"url": "cv/2b40a601986f90349b83e6e6b70f0011d7d7310e321f9bd1eb67de5f4bc08185.pdf", "filename": "pagaya__data-science-group-lead__3a5b5295__tailored_cv_final.pdf", "kind": "other", "primary": true}]}, {"id": "J-17c0105713fd67e1551ed71d", "organization": "Pagaya", "title": "Principal Data Scientist", "a": 5, "b": 2, "alternative": false, "description": "About Pagaya\nPagaya is a global technology company making life-changing financial products and services available to more people nationwide, as it reshapes the financial services ecosystem. By using machine learning, a vast data network and a sophisticated AI-driven approach, Pagaya provides comprehensive consumer credit and residential real estate solutions for its partners, their customers, and investors. Its proprietary API and capital solutions integrate into its network of partners to deliver seamless user experiences and greater access to the mainstream economy. Pagaya has offices in New York and Tel Aviv. For more information, visit pagaya.com.\nAbout the Role\nWe are looking for a visionary Principal Data Scientist to lead strategic research initiatives focusing on our Personal Loans asset class. In this high-impact, individual contributor role, you will be at the absolute forefront of our research department. You will tackle Pagaya’s most challenging, long-term research questions, working hands-on to advance our sophisticated models while providing high-level professional leadership and mentorship to data scientists across the group.\nResponsibilities\nAct as the technical authority and professional lead for the Personal Loans research group, setting the standard for scientific rigor and innovation.\nSpearhead complex, long-term research initiatives that address fundamental challenges in credit risk, behavioral modeling, and portfolio optimization.\nDevelop cutting-edge Machine Learning models and algorithms from scratch, moving from high-level hypothesis to production-ready solutions.\nDesign multi-domain Data Science solutions for the company’s core mission, identifying untapped opportunities within our vast datasets.\nMentor senior and staff data scientists, advising on methodology, experimental design, and technical roadblocks without the overhead of people management.\nPartner with Product, Engineering, and Finance stakeholders to align long-term research goals with Pagaya’s strategic business roadmap.\nRequirements\n10+ years of experience in Machine Learning with large-scale tabular data. specifically focusing on predictive modeling (Advantage)\nMSc or PhD in a highly quantitative field (Math, Physics, CS, Stats, or EE).\nA track record of translating complex, long-term research projects into significant, measurable business impact in a production environment.\nGood applied statistics skills, such as distributions, statistical testing, regression, etc.\nDeep expertise in the Python Data Science stack and advanced applied statistics.\nExcellent interpersonal skills with the ability to influence technical roadmaps and communicate complex scientific concepts to non-technical stakeholders.\nOur Team\nPagaya was founded in 2016 by seasoned research, finance, and technology entrepreneurs, and we are now 500+ strong in New York, Los Angeles, and Tel Aviv.\nWe move fast and smart, identifying new opportunities and building end-to-end solutions from AI models and unique data sources. Every Pagaya team member is solving new and exciting challenges every day in a culture based on partnership, collaboration, and community.\nJoin a team of builders who are working every day to enable better outcomes for our partners and their customers.\nOur Values\nOur values are at the heart of everything we do. We believe great solutions are built through a great community.\nAdvance Inclusion- We create a world where everyone can win, designing systems that better represent people and generate sustainable value for our employees, partners and investors.\nBe Accountable Together- We proudly own our actions and our results, taking initiative to ensure our work gets over the finish line as a team.\nContinuously Learn- We challenge ourselves for the sake of getting better as individuals, as teams, and as an organization to deliver for our partners.\nDebate and Commit- We respectfully and openly debate to strengthen our ideas and build shared conviction - once we decide, we go all in, together.\nDream Big and Act- We boldly tackle complex problems, pressure-test solutions in real-time, and adapt with speed and energy.\nMore than just a job\nWe believe health, happiness, and productivity go hand-in-hand. That's why we're continually looking to enhance the ways we support you with benefits programs and perks that allow every Pagayan to do the best work of their life.\nPagaya is an equal opportunity employer. Pagaya is encouraging diversity and actively seeking applicants from all backgrounds, as are committed to creating a diverse workforce together with an inclusive environment for all. Employment is decided on the basis of qualifications, skills, and business needs.\nhttps://pagaya.com/privacy-policy", "language": "en", "documents": [{"url": "cv/9ee4df27b5f9dbe452043edc3261cddd7b2ec74d57c5a29119b6ca5b63a9c72d.pdf", "filename": "pagaya__principal-data-scientist__e58f1269__tailored_cv_final.pdf", "kind": "other", "primary": true}]}, {"id": "J-19703b7fc45bfda00858c3eb", "organization": "Mertens Malam Team", "title": "Data & AI Product Manager", "a": 5, "b": 3, "alternative": false, "description": "חברת Mertens Malam Team מגייסת מנהל.ת מוצר Data & AI לארגון פיננסי מוביל במרכז\n\nתיאור\n\nבמסגרת התפקיד הובלת יעדים עסקיים מקצה לקצה, ניתוח דאטה, איתור כשלים והזדמנויות והובלת פתרונות עד לפרודקשן ולאימפקט מדיד.\n\nאפיון והטמעת פתרונות ML ו-GenAI בתהליכי ליבה, הגדרת KPIs ושיטות Evaluation ועבודה שוטפת עם צוותי Data Science.\n\nעבודה צמודה עם משתמשים עסקיים ותכלול בין צוותי דאטה, פיתוח, UX והגורמים העסקיים בארגון גדול ומורכב.\n\nדרישות\n\n- ניסיון של 3 שנים לפחות בניהול מוצר מקצה לקצה בחברה אזרחית\n- ניסיון מוכח בהובלת מוצר, פיצ'ר או תהליך מבוסס GenAI או ML עד לפרודקשן\n- ניסיון בעבודה עם דאטה, ניתוח נתונים, הגדרת מדדים וקבלת החלטות מבוססות נתונים\n- יכולת עבודה עצמאית גבוהה והצגת מוצר מורכב והאימפקט העסקי שלו באופן תמציתי\n- היכרות עם SQL ו-Python – יתרון", "language": "he", "documents": [{"url": "cv/2acd6b1a94befae888f6de81dc1ef0b0d73ef73e99877f95cff8e09126f0d487.pdf", "filename": "Yehuda_Raanan_Mertens_Data_AI_Product_Manager_CV.pdf", "kind": "annotated", "primary": true}, {"url": "cv/eb2c6fbe65b69f445208573fbff346386b70e4e1bab2bc8d97f2d88d8313d63c.pdf", "filename": "Yehuda_Raanan_Mertens_Data_AI_Product_Manager_CV_Clean.pdf", "kind": "clean", "primary": true}]}, {"id": "J-1ec455d381159faba2fa9806", "organization": "Undisclosed defense organization", "title": "Senior Data Scientist - NLP / Applied AI", "a": 4, "b": 3, "alternative": false, "description": "# Senior Data Scientist - NLP / Applied AI\n\nEmployer: undisclosed leading defense organization in Central Israel.\n\nWork arrangement: fully on-site, no hybrid option.\n\nEmployment condition: successful completion of the required security-clearance process.\n\n## Responsibilities\n\n- Develop and implement AI and Machine Learning solutions, with a strong focus on Natural Language Processing.\n- Take hands-on ownership across the full solution lifecycle: understand the challenge and data, conduct research and experimentation, develop models, and implement the solution.\n- Develop and improve models and algorithms for text processing, analysis, and understanding.\n- Work with advanced NLP technologies, including Transformer-based models and LLMs.\n- Perform model evaluation, define relevant metrics, analyze performance, and continuously improve model quality.\n- Collaborate with software, product, and technology teams to integrate AI capabilities into existing and new systems.\n- Explore emerging AI technologies, methodologies, and tools and assess their applicability to real-world challenges.\n\n## Requirements\n\n- At least three years of hands-on Data Scientist experience, with significant NLP expertise.\n- Proven hands-on experience developing Machine Learning and Deep Learning solutions.\n- Strong practical experience with text processing, NLP, and NLU.\n- Strong Python skills and experience with common Data Science and Machine Learning frameworks and libraries.\n- Solid understanding of model training, evaluation, validation, and optimization.\n- Ability to translate complex operational or technological challenges into practical AI solutions.\n- Ability to work independently in a complex technological environment.\n\n## Advantages\n\n- Five or more years of Data Science experience.\n- Experience with LLMs, Generative AI, RAG, and/or AI Agents.\n- Experience with Hugging Face, PyTorch, and/or TensorFlow.\n- Experience taking AI/ML models from research and experimentation into production.\n- Experience working with unstructured data and complex NLP systems.", "language": "en", "documents": [{"url": "cv/5aa3a9d70412f0d8b4882eb7b28dcdb4140718151cb479448051f18019152985.pdf", "filename": "Yehuda_Raanan_Senior_Data_Scientist_NLP_Applied_AI_CV.pdf", "kind": "annotated", "primary": true}, {"url": "cv/032129f5a2f6a63654927a2c14a9e8b9c3153bd8d4399d786cc2d8ec7ec1cfc8.pdf", "filename": "Yehuda_Raanan_Senior_Data_Scientist_NLP_Applied_AI_CV_Clean.pdf", "kind": "clean", "primary": true}]}, {"id": "J-2212cce705d5aee160910f91", "organization": "Notch", "title": "Agent Product Manager", "a": 5, "b": 3, "alternative": false, "description": "Notch is the AI operating system built for enterprises running complex, regulated operations. We deploy purpose-built agents that resolve real workflows end-to-end, compliantly and at scale across insurance and financial services.\n\nWe’re a fast-growing startup at the forefront of the AI revolution, helping companies scale smarter and cut costs. Our platform connects customer and employee interactions with back-office systems to automate complex workflows end-to-end - all delivered with the highest standards for auditability, explainability, and governance.\n\nBacked by top-tier VCs, Notch has raised $45 million to date, including a $30 million Series A in March 2026 led by Headline, with participation from Lightspeed, Jibe Ventures, Illuminate Financial, Munich RE, and Phoenix.\n\n‍\n\n*About The Role:*\n\nAs an Agent Product Manager at Notch, you will work directly with enterprise customers to design, deploy, and optimize AI agents tailored to their brand and workflows. You’ll own customer outcomes end-to-end, act as the bridge between customers and engineering, and help shape the future of our platform through real-world insights.\n\n*What You'll do:*\n\n* Design, build, and refine AI agents alongside customers - diving deep into their workflows, challenges, and goals to craft tailored solutions.\n* Create fast feedback loops with engineering - translating real-world needs into product improvements and new capabilities.\n* Partner closely with your engineering pod to deliver new features and enhancements that support specific customer use cases.\n* Own the full lifecycle of customer AI agents - from initial deployment through ongoing optimization and success.\n* Represent Notch externally - collaborating with enterprise customers, driving key deployments, and showcasing the future of AI-powered CX.\n\nRequirements\n------------\n\n* Have 5+ years of relevant experience (e.g., product manager, Technical project lead).\n* Are technically savvy - able to understand system integrations, workflows, and AI agent design.\n* Possesses strong communication and relationship-building skills.\n* Are comfortable operating in fast-paced, ambiguous environments, shaping solutions on the fly.\n* Have excellent verbal and written communication skills in English.", "language": "en", "documents": [{"url": "cv/18d2b65ce8a7c7cfb8064e81d2d90f5e2f43b8d50a9181b563d3270bc6278100.pdf", "filename": "notch__agent-product-manager__328ff4f0__tailored_cv_final.pdf", "kind": "other", "primary": true}]}, {"id": "J-2b67196444e523584520e417", "organization": "FinTrust Connect", "title": "Validation Senior Analyst Model Risk -FinTrust Connect Talent Community -Remote", "a": 3, "b": 3, "alternative": false, "description": "Validation Senior Analyst Model Risk - FinTrust Connect Talent Community\n------------------------------------------------------------------------\n\nFinTrust Connect United States Remote\n-------------------------------------\n\nShare Your Resume and Build Your Future!\n\nJoin our Talent Community and be considered for upcoming roles with leading banks and fintechs. Remote and hybrid opportunities across major hubs.\n\nAs a Validation Senior Analyst you will execute independent testing across CECL and credit and pricing and ALM and forecasting and AML models in line with SR 11 7. You will perform data and methodology and implementation testing and draft examiner grade workpapers and reports.\n\nRequirements\n------------\n\n* \n\n4 to 7 years in model risk or validation within banking or consulting\n\n* \n\nWorking knowledge of SR 11 7 and OCC and FDIC expectations\n\n* \n\nHands on testing data integrity and conceptual soundness and performance monitoring and implementation checks\n\n* \n\nProficiency in Python or R and SQL\n----------------------------------\n\n* \n\nClear writing and evidence discipline\n-------------------------------------\n\nResponsibilities\n----------------\n\n* \n\nPlan and execute test scripts and sampling and backtesting and benchmarking\n\n* \n\nRebuild components as needed and document results and limitations\n\n* \n\nDraft validation reports and issues with severity and actions and due dates\n\n* \n\nSupport monitoring plan setup and KPI thresholds and drift checks\n\n* \n\nPartner with model owners and validators on closure testing\n\nOutcomes we track\n-----------------\n\n* \n\nFirst pass acceptance *95%* with zero repeat findings over *2* quarters\n\n* \n\nValidation schedule delivery *100%* on time\n\n* \n\nMonitoring plans installed *100%* for in scope models\n\n* \n\nDocumentation completeness *100%*\n\nCompensation and terms\n----------------------\n\n* \n\nConsultant pay *$50 to $120 per hour* based on domain depth\n\n* \n\nContract Remote US W2 or 1099\n-----------------------------\n\n* \n\nMultiple openings for national pods\n-----------------------------------\n\nHow to apply\n------------\n\n* \n\nApply on our site *FinTrust Careers*\n\n* \n\nOr email *talent@FinTrustConnect.com* with subject *[Apply] Validation Senior Analyst Remote US*\n\n* \n\nFollow *FinTrust Connect on LinkedIn*\n\n*Keywords*\nModel Risk, Validation, SR 11 7, OCC, FDIC, CECL, Credit Risk, Pricing, ALM, Forecasting, AML Models, Testing, Backtesting, Benchmarking, Implementation, Python, R, SQL, Documentation, Evidence, Remote", "language": "en", "documents": [{"url": "cv/1f7aeb7b810e31ee27d24c90818a56274db5da505a85c2faa8615aaed3afd994.pdf", "filename": "fintrust-connect__validation-senior-analyst-model-risk-fintrust-connect-talent__ead7ecb7__tailored_cv_final.pdf", "kind": "other", "primary": true}]}, {"id": "J-2bd694decb018d91031341a1", "organization": "Pagaya", "title": "Senior Data Scientist", "a": 5, "b": 3, "alternative": false, "description": "About Pagaya\nPagaya is a global technology company making life-changing financial products and services available to more people nationwide, as it reshapes the financial services ecosystem. By using machine learning, a vast data network and a sophisticated AI-driven approach, Pagaya provides comprehensive consumer credit and residential real estate solutions for its partners, their customers, and investors. Its proprietary API and capital solutions integrate into its network of partners to deliver seamless user experiences and greater access to the mainstream economy. Pagaya has offices in New York and Tel Aviv. For more information, visit pagaya.com.\nAbout the Role\nWe are looking for a Senior Data Scientist to lead strategic research initiatives . This individual will be at the forefront of Pagaya’s research, working hands-on to advance our models while also mentoring and collaborating with data scientists across the department.\nResponsibilities\nSpearhead strategic research of new cutting edge Machine Learning models\nMentor and advise data scientists.\nDesign solutions for the company’s core mission using Data Science methodologies from various domains\nWork in a short life-cycle research and development environment\nGenerate and test working hypotheses in unexplored territory\nRequirements\n5+ years of experience in Machine Learning, working with tabular data on predictive modeling\nTrack record of translating research into business impact\nMSc or PhD in a related field- Math/EE/CS/Physics/Stats\nGreat interpersonal skills, and strong collaborator\nGood applied statistics skills, such as distributions, statistical testing, regression, etc.\nProficient in Python and the Data Science Stack\nIndependent and fast learner that can work alone and in teams\nAbility to learn and explore new fields of expertise\nKnowledge in some of the following can be an advantage: optimization, risk and finance\nOur Team\nPagaya was founded in 2016 by seasoned research, finance, and technology entrepreneurs, and we are now 500+ strong in New York, Los Angeles, and Tel Aviv.\nWe move fast and smart, identifying new opportunities and building end-to-end solutions from AI models and unique data sources. Every Pagaya team member is solving new and exciting challenges every day in a culture based on partnership, collaboration, and community.\nJoin a team of builders who are working every day to enable better outcomes for our partners and their customers.\nOur Values\nOur values are at the heart of everything we do. We believe great solutions are built through a great community.\nAdvance Inclusion- We create a world where everyone can win, designing systems that better represent people and generate sustainable value for our employees, partners and investors.\nBe Accountable Together- We proudly own our actions and our results, taking initiative to ensure our work gets over the finish line as a team.\nContinuously Learn- We challenge ourselves for the sake of getting better as individuals, as teams, and as an organization to deliver for our partners.\nDebate and Commit- We respectfully and openly debate to strengthen our ideas and build shared conviction - once we decide, we go all in, together.\nDream Big and Act- We boldly tackle complex problems, pressure-test solutions in real-time, and adapt with speed and energy.\nMore than just a job\nWe believe health, happiness, and productivity go hand-in-hand. That's why we're continually looking to enhance the ways we support you with benefits programs and perks that allow every Pagayan to do the best work of their life.\nPagaya is an equal opportunity employer. Pagaya is encouraging diversity and actively seeking applicants from all backgrounds, as are committed to creating a diverse workforce together with an inclusive environment for all. Employment is decided on the basis of qualifications, skills, and business needs.\nhttps://pagaya.com/privacy-policy", "language": "en", "documents": [{"url": "cv/c409e0306b21eb00b47efca83bda1b7a539c8b7ad6abed9e0f7fb5221b7cfbc3.pdf", "filename": "pagaya__senior-data-scientist__dc74cda7__tailored_cv_final.pdf", "kind": "other", "primary": true}]}, {"id": "J-35b202b6888db2adcfe23dd1", "organization": "Armis Security", "title": "Senior Staff Inbound Product Manager", "a": 4, "b": 2, "alternative": false, "description": "Armis, *the cyber exposure management & security company* , protects the entire attack surface and manages an organization’s cyber risk exposure in real time. In a rapidly evolving, perimeter-less world, Armis ensures that organizations continuously *see* , *protect* and *manage* all critical assets - from the *ground to the cloud*. Armis secures Fortune 100, 200 and 500 companies as well as national governments, state and local entities to help keep critical infrastructure, economies and society stay safe and secure 24/7.\n\nArmis is a privately held company headquartered in California.\n\nArmis cyber exposure management cloud-based platform helps our clients to map their entire attack surface, proactively mitigate cyber risks, remediate vulnerabilities, and block threats.\n\nOur hundreds of clients span across all verticals and industries, including Manufacturing, Health and Medical, Information Technology, Energy and Utilities, Financial Services, Transportation, Telecommunications and Media, Public Sector and many more.\n\nArmis is looking for an experienced, creative, and highly motivated Product Manager with experience in complex cybersecurity products to join us and lead some of our portfolio's most innovative parts.\n\n*What you'll do*\n\n* Collaborate with executives, peers, clients, and analysts to define the vision and strategy of the domain under your responsibility.\n* Translate strategy to product roadmaps based on market requirements, competitive position, and operational constraints.\n* Communicate plans and establish shared understanding across the company by building consensus on priorities.\n* Oversee product development by our top-notch RnD organization\n* Work closely with Pre and post-sales teams to ensure product market fit and customer satisfaction. Define and analyze metrics that inform the success of products.\n* Maximize efficiency and improve product management methodologies\n\n*What we expect*\n\n* 6+ years of experience in Product Management roles\n* Experience building security products and a strong technical background\n* Strong analytical and problem-solving skills with a data-driven approach to decision-making\n* Outstanding communication and presentation skills, capable of conveying complex concepts clearly and persuasively.\n* ‘Get SXXX done’ approach and great interpersonal skills\n\nThe choices you make in your career journey matter. You want to do interesting work in an important field while also having time to live your life, which is why we place so much value in your life-work balance. Armis sets you up for success with comprehensive health benefits, discretionary time off, paid holidays including monthly me days, and a highly inclusive and diverse workplace. Put your unique experiences and perspective to work in an environment where they will enable you to thrive, grow, and live your life with integrity.\n\nArmis is proud to be an equal opportunity employer. We never discriminate based on race, ethnicity, color, ancestry, national origin, religion, sex, sexual orientation, gender identity, age, disability, veteran status, genetic information, marital status or any other legally protected (or not) status. In compliance with federal law, all persons hired will be required to submit satisfactory proof of identity and legal authorization.\n\nPlease click here to review our privacy practices.", "language": "en", "documents": [{"url": "cv/fe9f72b9aaebd352d7826a3b31822ddf6bf66b4ed97e37f04407766d8713606d.pdf", "filename": "armis-security__senior-staff-inbound-product-manager__cc9fc103__tailored_cv_final.pdf", "kind": "other", "primary": true}]}, {"id": "J-3730fb3fa3164d53aa2b946c", "organization": "FinTrust Connect", "title": "Validation Senior Analyst Model Risk -New York, NY -Hybrid", "a": 3, "b": 3, "alternative": false, "description": "----------------------------------------------------------\nValidation Senior Analyst Model Risk -New York, NY -Hybrid\n----------------------------------------------------------\n\nShare Your Resume and Build Your Future!\n\nJoin our Talent Community and be considered for upcoming roles with leading banks and fintechs in New York. You will partner with model owners and validators on site as needed for walkthroughs and committee prep.\n\nAs a Validation Senior Analyst you will execute independent testing across CECL and credit and pricing and ALM and forecasting and AML models in line with SR 11 7. You will perform data and methodology and implementation testing and draft examiner grade workpapers and reports.\n\n*Requirements:*\n\n* ** 4 to 7 years in model risk or validation within banking or consulting\n* Working knowledge of SR 11 7 and OCC and FDIC expectations\n* Hands on testing data integrity and conceptual soundness and performance monitoring and implementation checks\n* Proficiency in Python or R and SQL\n* Clear writing and evidence discipline\n\n*Responsibilities:*\n\n* ** Plan and execute test scripts and sampling and backtesting and benchmarking\n* Rebuild components as needed and document results and limitations\n* Draft validation reports and issues with severity and actions and due dates\n* Support monitoring plan setup and KPI thresholds and drift checks\n* Partner with model owners and validators on closure testing\n\n*Outcomes we track:*\n\n* \n\nFirst pass acceptance *95%* with zero repeat findings over *2* quarters\n\n* \n\nValidation schedule delivery *100%* on time\n\n* \n\nMonitoring plans installed *100%* for in scope models\n\n* \n\nDocumentation completeness *100%*\n\n*Compensation and terms:*\n\n* \n\nConsultant pay *$70 to $150 per hour* based on domain depth\n\n* \n\nContract Hybrid New York NY or Remote US W2 or 1099\n\n*How to apply*\n\n* \n\nApply on our site *FinTrust Careers*\n\n* \n\nOr email *talent@FinTrustConnect.com* with subject *[Apply] Validation Senior Analyst New York*\n\n*\n*\n\nFollow *FinTrust Connect on LinkedIn*\n\n*\n*\n\n*Keywords*\nModel Risk, Validation, SR 11 7, OCC, FDIC, CECL, Credit Risk, Pricing, ALM, Stress, Forecasting, AML Models, Backtesting, Benchmarking, Python, R, SQL, Workpapers, Governance, New York", "language": "en", "documents": [{"url": "cv/be4135f102a6677d70a72c367d1ad55cb9b5d559700f0200844e5ce685a7e995.pdf", "filename": "fintrust-connect__validation-senior-analyst-model-risk-new-york-ny-hybrid__3f6e37ef__tailored_cv_final.pdf", "kind": "other", "primary": true}]}, {"id": "J-51e2e12d759ef39390044646", "organization": "NICE", "title": "Treasury Manager", "a": 3, "b": 2, "alternative": false, "description": "\n\nAt NiCE, we don’t limit our challenges. We challenge our limits. Always. We’re ambitious. We’re game changers. And we play to win. We set the highest standards and execute beyond them. And if you’re like us, we can offer you the ultimate career opportunity that will light a fire within you.\n\nSo, what’s the role all about?\n\nNiCE is looking for a Treasury Manager to help run the day-to-day treasury operations that keep the business funded, liquid, and protected against financial risk. You'll work closely with the Head of Treasury on cash management, funding, FX, and banking relationships, and you'll be a key partner to Corporate Finance during quarterly close and planning cycles. This is a hands-on role for someone who's comfortable owning process, spotting risk early, and making complex financial mechanics easy for others to understand.\n\nHow will you make an impact?  \n\n- Manage daily cash positioning, liquidity forecasting, and short-term investment activity across global entities.\n\n- Support debt and funding activities, including covenant tracking and lender reporting.\n\n- Monitor and submit share buyback plans in line with board-approved programs.\n\n- Lead professional initiatives and cross functional projects.\n\n- Act as professional focal point for the global treasury teams.\n\n- Partner with Corporate Finance and Accounting on treasury-related close activities, reconciliations, and disclosures.\n\n- Prepare board- and audit-ready reporting on cash, debt, and risk positions.\n\n- Lead and support M&A, intercompany funding, and other strategic finance projects as they arise.\n\nGlobal insurance programs\n\n- Manage global insurance programs, ensuring adequate coverage for operational risks and negotiating favorable terms during renewals.\n\n- Implement risk mitigation measures within insurance programs to minimize potential financial impacts from identified risks.\n\nRisk management\n\n- Identify, monitor, and mitigate financial risks, including interest rate, foreign exchange, and credit risk.\n\n- Implement hedging strategies and other financial instruments to manage risk exposures.\n\n- Ensure compliance with internal policies and regulatory requirements.\n\nTreasury operations and technology\n\n- Oversee banking relationships, account structures, and payment processing.\n\n- Leverage tools such as ERP systems and data visualization platforms to enhance decision-making and KPI tracking.\n\n- Drive automation and technology integration to streamline treasury processes.\n\n- Maintain an efficient system of policies and procedures that provides adequate control over treasury activities and supports regulatory reporting.\n\n- Explore and implement AI-driven tools that enhance treasury workflows, improving accuracy and efficiency in processes such as cash management and forecasting.\n\nHave you got what it takes?\n\n- 5+ years of treasury in corporate finance.\n\n- Solid grasp of cash management, FX, and debt/funding instruments.\n\n- Experience with ERP systems, data visualization tools, and banking platforms.\n\n- Strong Excel skills and comfort working with large data sets.\n\n- A clear communicator who can explain treasury mechanics to non-treasury stakeholders.\n\n- A degree in finance, accounting, or economics; CTP or similar certification is a plus.\n\n- A builder's mindset – someone who improves process, not just runs it.\n\n- Collaboration with banks and financial institutions – an advantage.\n\n- A good understanding of financial modeling and analysis techniques.\n\n- Skilled at project management, multi-tasking, and working in a global, fast-paced environment.\n\n- Proactive, self-starter, while working collaboratively within a team environment.\n\n- Excellent English.\n\nWhat’s in it for you?\n\nJoin an ever-growing, market-disrupting, global company where the teams – comprised of the best of the best – work in a fast-paced, collaborative, and creative environment! As the market leader, every day at NiCE is a chance to learn and grow, and there are endless internal career opportunities across multiple roles, disciplines, domains, and locations. If you are passionate, innovative, and excited to constantly raise the bar, you may just be our next NiCEr!\n\nEnjoy NiCE-FLEX!\n\nAt NiCE, we work according to the NiCE-FLEX hybrid model, which enables maximum flexibility: 2 days working from the office and 3 days of remote work, each week. Naturally, office days focus on face-to-face meetings, where teamwork and collaborative thinking generate innovation, new ideas, and a vibrant, interactive atmosphere.\n\nRequisition ID: 11524\nReporting into: Head of Treasury\nRole Type: IC\n\n#LI-Hybrid\n\nAbout NiCE \n\nNICE Ltd. (NASDAQ: NICE) software products are used by 25,000+ global businesses, including 85 of the Fortune 100 corporations, to deliver extraordinary customer experiences, fight financial crime and ensure public safety. Every day, NiCE software manages more than 120 million customer interactions and monitors 3+ billion financial transactions. \n\nKnown as an innovation powerhouse that excels in AI, cloud and digital, NiCE is consistently recognized as the market leader in its domains, with over 8,500 employees across 30+ countries. \n\nNiCE is proud to be an equal opportunity employer. All qualified applicants will receive consideration for employment without regard to race, color, religion, national origin, age, sex, marital status, ancestry, neurotype, physical or mental disability, veteran status, gender identity, sexual orientation or any other category protected by law.\n\n", "language": "en", "documents": [{"url": "cv/00dab6086a4d995489a517c5148bad157f00c34d8d859ccabed29cee9e28eb2f.pdf", "filename": "nice__treasury-manager__89d741e8__tailored_cv_final.pdf", "kind": "other", "primary": true}]}, {"id": "J-6474e9bd6ffa47aa54f73ed9", "organization": "Oriient", "title": "Senior Product Manager & AI Builder", "a": 5, "b": 3, "alternative": false, "description": "About Oriient:\nAt Oriient, we are building the world’s most accurate Indoor GPS, and the only one that needs no hardware at all. We are a VC-backed company in a phase of hyper-growth with strong market traction, live in thousands of locations worldwide across retail, smart buildings, hospitals, campuses, and other large indoor environments.\nOn top of the positioning engine sits a thick agentic layer that turns location into intelligence. Every session feeds a dataset of indoor traffic and behavior at enormous volume, unmatched anywhere in the market, and a growing set of AI agents and LLM-based tools that surface insights from it: how people move, dwell, and shop inside physical spaces, delivered to our customers and to our own teams as answers, alerts, and recommendations rather than raw data.\nJob Summary:\n\nWe are looking for a Senior Product Manager who is also a hands-on builder. Not a PM who only writes specs for someone else to implement, and not an engineer without product judgment. Someone who can find the problem, decide it is worth solving, build the first working version themselves, and then take it to real users.\nYou will take AI products and internal agents from problem to production, across the company. That means customer-facing AI capabilities built on our indoor data, and the internal agents and tools our own teams run on. The scope is deliberately broad: the problems worth solving will not always sit in the same department, and we are looking for someone who can pick up any of them without needing the domain handed to them.\nIn parallel, you will join an effort already underway to turn Oriient’s R&D into an agentic process, and build a meaningful part of it yourself. The goal is an order-of-magnitude change in how fast we move from an idea to production.\nKey Responsibilities:\nOwn AI products end to end\n- Own your part of the roadmap. Help define the product roadmap, decide what gets built in your area, in what order, and why, and make sure every effort ties back to a measurable outcome for a real user, whether that user is a customer or a colleague.\n- Run your own discovery. Sit with the people whose work you are changing, find the friction yourself, and turn it into a prioritized set of problems rather than a queue of requests.\n- Define what good means for AI products. Together with the engineers building them, set evaluation criteria, quality thresholds, and release gates for AI-based features, and keep watching them after launch.\n- Know when to stop. Set go/no-go gates on exploratory work and make the call, with the team, to kill the efforts that do not pay off, early.\nBuild it yourself\n- Ship working software. Use current models and agentic coding tools to build and ship agents, tools, and prototypes, sometimes on your own and sometimes alongside engineering. You are a builder, not only a spec writer.\n- Make prototype-first the default. Turn a requirement into something that runs, then decide with the team whether it deserves to become a product. Raise the building bar of the whole product and R&D organization.\n- Take things to production. Get from a prototype that works on your machine to a tool with real users, real data, and a clear owner, working with engineering on what needs to be productized properly.\nHelp make Oriient AI-native\nThis transformation is already underway and has people behind it. You will be a significant part of that effort, not the only one driving it.\n- Help redesign how we go from idea to production. Together with Product and R&D leadership, rethink the development lifecycle around AI agents, with people where judgment is needed and agents everywhere else.\n- Drive adoption and quality. Help take agents and tools from pilot to daily use across teams, with the guardrails that keep speed from costing quality or security.\n- Measure velocity, not activity. Contribute to the metrics that show the transformation is working, and to reporting progress against an order-of-magnitude target.\n- Spread the practice. Teach, pair, and publish, so that building with AI becomes the normal way people here work rather than something one team does.\nQualifications and Experience:\n- 5+ years of product management experience on technical products, with a track record of shipping things that people actually use.\n- Development background. You have written code professionally as an engineer, or you have a technical degree plus a real history of building. You can read a codebase, take part in an architecture discussion, and hold your own with senior engineers.\n- Hands-on AI builder. You use current models and agentic coding tools every day to build working tools, agents, and prototypes, and you can show us what you built. Using AI to summarize documents or draft specs does not count.\n- Shipped AI to production. At least one AI-based production grade capability with real business impact (LLM, ML, or computer vision) released to real users, where you can describe how quality was defined, measured, and maintained.\n- Range across disciplines. Experience in more than one discipline (product, engineering, data, design, operations) and a track record of owning problems across different domains, teams, or functions. You get productive in an unfamiliar area quickly and do not need the problem pre-scoped for you.\n- Analytical and creative in equal measure. You can read an evaluation, question a methodology, and reason from data. You can also invent the thing nobody asked for. This role needs both: the rigor to know whether something actually works, and the imagination to see what is worth building next.\n- Product fundamentals. Discovery, prioritization, crisp requirements, metrics, and the ability to say no with a reason. Comfortable with data (SQL, notebooks, BI) to answer your own questions. Excellent written and verbal communication in English.\nAdvantages:\n- Background as an engineer, data scientist, or technical founder before moving into product.\n- Experience building with agent frameworks, MCP, evals, and multi-agent workflows, or running coding agents in CI/CD.\n- Experience in developer experience, internal platforms, or engineering productivity tooling.\n- A history of building internal tools that people adopted and kept using.\n- Startup or high-growth experience, ideally where you were the first to bring AI-native practices into the team.", "language": "en", "documents": [{"url": "cv/4c1f075883802309bdc88354169d1ba8842a67ecf59cca93b14ab9acdd54a323.pdf", "filename": "Yehuda_Raanan_Oriient_Senior_Product_Manager_AI_Builder_CV.pdf", "kind": "annotated", "primary": true}, {"url": "cv/b7eefda865b8ad19a896d36619727b4fa0676c3b581e287c1f1d6fba886304b5.pdf", "filename": "Yehuda_Raanan_Oriient_Senior_Product_Manager_AI_Builder_CV_Clean.pdf", "kind": "clean", "primary": true}]}, {"id": "J-66452e84f6aabc946e14a87c", "organization": "Chainalysis", "title": "Product Manager, Security", "a": 5, "b": 2, "alternative": false, "description": "We are the Hexagate team at Chainalysis in Tel Aviv! We build cybersecurity products that protect on-chain and web3 assets. We sit at the intersection of cybersecurity and blockchains - one of the most adversarial and fast-moving environments in tech, where attacks are constant and response time matters. Our real-time on-chain detection and response platform combines ML-driven threat intelligence, custom detections, and an LLM-powered rules engine - and it's critical infrastructure that some of the largest exchanges, banks, and institutions run in production to protect their assets. The team is part of Chainalysis, the leading on-chain data platform used by enterprises and public-sector teams worldwide.\n\nWe're a small, senior team where everyone owns real outcomes - and we're at an inflection point: the product is deep and battle-tested, the market is still being defined, and there's an unusual amount to own and shape.\n\n*In this role, you will:\n*\n\n* \n\nThe product end to end - strategy, roadmap, and day-to-day execution - with real decision-making authority, not just backlog management.\n\n* \n\nThe hard product problems: real-time monitoring across many chains, opinionated detection customers can trust, and turning our agent/LLM capabilities into a product that configures and calibrates security for the user.\n\n* \n\nThe customer relationship -you'll spend a lot of time with enterprise users, including the biggest names in crypto and TradFi, shaping the product with them.\n\n* \n\nThe prioritization calls, and keeping engineering, research, and GTM pointed at the same outcomes.\n\n*What we’re looking for*\n\n* \n\nA PM who has owned a technical or infrastructure product end to end and can go deep with engineers.\n\n* \n\nReal fluency in web3 / on-chain - smart contracts, wallets, exchanges, and how on-chain attacks actually work.\n\n* \n\nReal grounding in cybersecurity products (detection and response, monitoring, threat intelligence) and how security teams buy and operate.\n\n* \n\nAble to handle complex, high-stakes situations on both sides - driving alignment internally across engineering, research, and GTM, and holding your own with demanding enterprise customers.\n\n* \n\nSharp judgment on prioritization and trade-offs, and the drive to make the call under uncertainty.\n\n*\nNice to have*\n\n* \n\nExperience building agentic / LLM-powered products.\n\n* \n\nA background as a security practitioner, auditor, or on-chain builder - you've been the user.\n\n* \n\nExperience with enterprise or regulated buyers (banks, TradFi, exchanges).\n\n*Why Chainalysis\n*\n\n* \n\nReal problems. Real attackers. Real impact.\n\n* \n\nA small, senior team where everyone owns real outcomes - high ownership, close to customers.\n\n* \n\nStartup pace with the backing and data advantage of the world's leading blockchain intelligence company.\n\n*AI at Chainalysis*\nAI is not a feature at Chainalysis - it is a new way of working. One that turns instructions into work done, and helps us move faster than the threats we're built to counter, and we expect our employees to take ownership of the output and ensure quality. As the world's most trusted blockchain analytics platform, Chainalysis sits at a rare intersection of proprietary data, regulatory relationships and crypto expertise that makes it uniquely placed to shape and lead the next era of AI-driven intelligence - and we expect everyone here, regardless of role, to be an active part of it.\n\nAI fluency is tied directly to how we measure performance and how we plan to win. There is no substitute for your own curiosity. We provide the tools, workflows, and space to experiment - but the expectation is that you develop these capabilities yourself, bring ideas, and collaborate across teams to reinvent the way work gets done. We are not using AI to do less. We are using it to do what was never possible before.\n\n*About Chainalysis*\n\nChainalysis is the blockchain data platform, making it easy to connect the movement of digital assets to real-world services. Powered by deep blockchain data and AI, organizations can investigate illicit activity, manage risk exposure, and develop innovative market solutions built on the industry's most trusted blockchain intelligence. Our mission is to build trust in blockchains, blending safety and security with an unwavering commitment to growth and innovation.\n\n*You belong here.*\n\nAt Chainalysis, we believe that diversity of experience and thought makes us stronger. With both customers and employees around the world, we are committed to ensuring our team reflects the unique communities around us. We’re ensuring we keep learning by committing to continually revisit and reevaluate our diversity culture.\n\nWe encourage applicants across any race, ethnicity, gender/gender expression, age, spirituality, ability, experience and more. If you need any accommodations to make our interview process more accessible to you due to a disability, don't hesitate to let us know. You can learn more here. We can’t wait to meet you.", "language": "en", "documents": [{"url": "cv/faddd2a002c6cbc871cc2169ce4948f8e58e57edef443cdb7085cbd5ce357b06.pdf", "filename": "chainalysis__product-manager-security__ca1b8acf__tailored_cv_final.pdf", "kind": "other", "primary": true}]}, {"id": "J-72f7a37624828f13d84a6ad6", "organization": "Fireblocks", "title": "Product Manager, Mobile", "a": 4, "b": 3, "alternative": false, "description": "The world of digital assets is accelerating in speed, magnitude, and complexity, opening the door to new ways for leveraging the blockchain. Fireblocks’ platform and network provide the simplest and most secure way for companies to work with digital assets and it trusted by some of the largest financial institutions, banks, globally-recognized brands, and Web3 companies in the world, including BNY Mellon, BNP Paribas, ANZ Bank, Revolut, and thousands more.\n\n> \n> \n> \n> \n> \n> \n> \n> \n> \n> \n> \n> *About the role*\n> \n> \n> \n> Fireblocks' mobile app is a critical component in the day-to-day financial\n> operations of the world's leading financial institutions.\n> \n> \n> \n> As the Mobile PM, you'll own the full product domain: driving the roadmap,\n> collaborating closely with engineering and design, and ensuring every\n> feature ships with precision and measurable impact. But this is more than\n> a customer-facing product - it's also a foundational platform that other\n> product teams across Fireblocks rely on to deliver their features to\n> mobile users. You'll own both dimensions: driving the customer experience\n> outbound while advancing the infrastructure that makes it possible. As the\n> world moves toward agentic, AI-native financial operations, this team is\n> building exactly that. You define what gets built and why.\n> \n> \n> \n> \n> \n> \n> \n> *What you'll own*\n> \n> \n> \n> \n> \n> \n> \n> \n> * \n> \n> The mobile product end-to-end - roadmap, strategy, and delivery across iOS\n> and Android, with full accountability for outcomes.\n> \n> \n> * \n> \n> The customer experience - deeply understanding how institutional users\n> interact with their financial operations on mobile, and continuously\n> raising the bar.\n> \n> \n> * \n> \n> The mobile platform - working with product teams across Fireblocks to\n> understand their needs and ensuring mobile can support their features\n> effectively.\n> \n> \n> * \n> \n> The AI and intelligence layer on mobile - defining how smart, proactive\n> capabilities get surfaced to users in a way that adds real value.\n> \n> \n> \n> \n> \n> \n> *What the work actually looks like*\n> \n> \n> \n> * \n> \n> Spending significant time with customers and data - forming a sharp,\n> evidence-based view of what to build next and why.\n> \n> \n> * \n> \n> Making hard prioritization calls - balancing customer-facing improvements,\n> platform needs from internal teams, and long-term product investments.\n> \n> \n> * \n> \n> Working across teams - product, engineering, design, security, and\n> customer success - to align on scope and get things shipped.\n> \n> \n> * \n> \n> Owning the full arc of a feature - from problem definition and spec to\n> launch, adoption, and iteration.\n> \n> \n> \n> \n> \n> \n> *What you bring*\n> \n> \n> \n> * \n> \n> 4+ years in product management; experience owning a mobile product domain\n> is a strong plus.\n> \n> \n> * \n> \n> Experience in B2B SaaS or enterprise software - you understand\n> multi-stakeholder users and complex workflows.\n> \n> \n> * \n> \n> Strong data fluency - you write queries, build your own analysis, and\n> don't wait for a data team to tell you what's happening.\n> \n> \n> * \n> \n> Technical enough to have real conversations with engineers - you know what\n> \"hard\" looks like and write specs that leave no room for ambiguity.\n> \n> \n> * \n> \n> Experience with AI-powered features is a strong plus - especially mobile\n> or workflow-embedded AI.\n> \n> \n> \n> \n> \n> \n> *Nice to have*\n> \n> \n\n* \n\nBackground in fintech, digital assets, crypto, or financial infrastructure.\n\n* \n\nExperience with MPC wallets, custody platforms, or transaction approval flows.\n\n* \n\nExperience working with enterprise customers in high-security, high-stakes environments.\n\nFireblocks' mission is to enable every business to easily and securely access digital assets and cryptocurrencies. In order to do that, we strongly believe our workforce should be as diverse as our clients, and this is why we embrace diversity and inclusion in all its forms.\n\nPlease see our candidate privacy policy here.", "language": "en", "documents":
