 [{"url": "cv/2d9eef4c97de6276521dbbf0ac92855c2948ba2953f897c76e4e8271255ed1e6.pdf", "filename": "fireblocks__product-manager-mobile__536ecb1c__tailored_cv_final.pdf", "kind": "other", "primary": true}]}, {"id": "J-8077955845ea30f7925aa519", "organization": "Classiq", "title": "Product Manager Team Lead - QEC and post synthesis", "a": 4, "b": 2, "alternative": false, "description": "Classiq builds the software layer for quantum computing: a compiler, IDE, and platform that takes quantum algorithms from a high-level description down to hardware-ready execution. We are now building the software stack for the fault-tolerant era, where quantum error correction (QEC) turns noisy physical qubits into reliable logical ones. Our compilation and resource-estimation pipeline for surface-code lattice-surgery architectures is already being integrated into the product, and our roadmap is to become the compiler and resource-estimation layer across every emerging fault-tolerant hardware stack.\n\nWe are hiring a *Product Team Lead* to own our QEC initiative end-to-end and to lead a set of tightly connected product areas around it. This is a hands-on management role: you will personally drive our QEC product strategy while building and leading a team that also owns quantum execution, the Classiq quantum library, and a portfolio of business and partnership initiatives. You must be an outstanding technical product leader who can reason about hard, systems-level problems, earn the trust of a top-notch research team, and ramp quickly on the QEC domain.\n\n*What you'll do*\n\n* Set and communicate a crisp product vision and roadmap across QEC, execution, and the Classiq library, and align it with the company strategy and quarterly plan.\n* Work shoulder-to-shoulder with our QEC head of research and R&D leads to translate a research-heavy roadmap into a shippable product with clear scope, sequencing, and success criteria.\n* Run discovery with users, design partners, and hardware companies; convert their real constraints into requirements and credible resource-estimation deliverables.\n* Own prioritization and trade-offs across a broad surface area (research bets vs. near-term delivery, depth vs. breadth of architecture support).\n* Build, manage, and grow a product team; set the bar for product craft, writing, and decision-making.\n* Drive the business side: partnership scoping, positioning, packaging, and the narrative that makes Classiq the default FT software layer.\n* Keep execution honest: track delivery, surface risk early, and close the loop between roadmap commitments and what ships.\n\n*Who you are*\n\n* 7+ years in product management, including experience leading or mentoring PMs, in a deeply technical product (developer tools, compilers, EDA, HPC, ML infrastructure, scientific computing, or similar).\n* PhD or MSc in Quantum Information, Physics, Applied Mathematics, Electrical Engineering, Computer Science, or a closely related technical field.\n* Strong systems thinking: comfortable reasoning about compilation, optimization, resource trade-offs, and complex constrained problems.\n* A track record of owning ambiguous, research-adjacent roadmaps and turning them into shipped products.\n* Excellent written and verbal communication; able to earn credibility with PhD-level researchers and with commercial partners in the same week.\n* Business instinct: you can shape partnerships, positioning, and packaging, not just backlog.\n* Ability to ramp fast on a hard new domain and enjoy doing so.\n\n*Bonus points*\n\n* Background in quantum computing, quantum error correction, or fault tolerance (surface codes, lattice surgery, decoding, resource estimation).\n* Prior experience working directly with hardware companies or research labs as partners or customers.\n* Technical fluency (able to read code, specs, and research papers and hold your own in a design review).", "language": "en", "documents": [{"url": "cv/6041430f178c4b8e3374830e814078f62fdd951d29bda511a032061932e43bea.pdf", "filename": "classiq__product-manager-team-lead-qec-and-post-synthesis__bb71aa24__tailored_cv_final.pdf", "kind": "other", "primary": true}]}, {"id": "J-9eff4856201044d17bd48e21", "organization": "DoiT", "title": "Technical Product Manager - Attribute™", "a": 4, "b": 2, "alternative": false, "description": "*Location*\n\nOur Technical Product Manager for Attribute will be an integral part of our global Product team. This role is based *fully on-site* from the Attribute Tel Aviv office, located in *Carlibach St 29, Tel Aviv.*\n\n*Who We Are*\n\nDoiT is a global technology company that works with cloud-driven organizations to leverage the cloud to drive business growth and innovation. We combine data, technology, and human expertise to ensure our customers operate in a well-architected and scalable state - from planning to production.\n\nDelivering DoiT Cloud Intelligence, the only solution that integrates advanced technology with human intelligence, we help our customers solve complex multicloud problems and drive efficiency.\n\nWith decades of multicloud experience, we have specializations in Kubernetes, GenAI, CloudOps, and more. An award-winning strategic partner of AWS, Google Cloud, and Microsoft Azure, we work alongside more than 4,000 customers worldwide.\n\n*About* *Attribute™*\n\nMeet Attribute™: AI tokenomics without tags, SDKs, or code changes. A lightweight eBPF sensor installs in 15 minutes and starts producing per-customer, per-feature, and per-agent cost the same day. No instrumentation. No tagging policy. No engineering lift.\n\nThe problem it solves is real and measurable. In DoiT's survey of 500 finance and technology leaders, only 15% said they could calculate AI ROI without significant bottlenecks — and 79% experienced AI-related cost overruns in the past 12 months. AI spend is tripling. Visibility isn't keeping up. Attribute™ fixes that, at the kernel level, with nothing to instrument.\n\n*The Opportunity*\nAttribute is a small, high-ownership team working with large customers. We’re hiring a Technical Product Manager to partner with the existing product director and own a broad product surface.This is a hands-on, high-leverage role spanning product discovery, PRDs, customer investigations, data analysis, AI-driven workflows, and delivery.\n\nThis role is designed for someone with a technical product mindset who thinks in systems, not just features. You should be comfortable working deep within cloud infrastructure, distributed systems, data, APIs, and real-world DevOps, Cloud Infrastructure, and FinOps workflows. You will help turn broad customer and platform needs into clear technical product direction, sequenced investments, and reliably delivered capabilities.\n\nYou will report to the Director of Product, Attribute and will collaborate closely with engineering leadership, architects, security, customer-facing teams, and customers to determine what the team should build next and why.\n\n*Responsibilities*\n\n* Fast iteration and backlog leadership\n* Deep user and workflow understanding\n* Customer validation and external communication\n* Engineering-embedded technical product ownership\n* Quality, outcomes, and measurement\n\n*Qualifications*\n\n* 4+ years of relevant hands-on experience as a Technical Product Manager, Product Owner, Platform Engineer, DevOps Engineer, SRE, Cloud Engineer, Solutions Architect, or in a similar role working with or building products for public cloud infrastructure—or equivalent depth of experience. We’re hiring for the person, not the title.\n* A strong product sense for turning messy problems into clear scope and shipped value without waiting for perfect information.\n* Systems thinking: ability to reason about complex distributed systems, architectural trade-offs, and long-term product evolution.\n* Prioritization: demonstrated ability to balance customer needs, engineering constraints, and product investments when making prioritization decisions.\n* Deep curiosity and technical fluency in cloud fundamentals, including cost and billing concepts, compute, storage, networking, Kubernetes, observability, automation, and public cloud infrastructure across AWS, GCP, and/or Azure.\n* An optimizer by nature: you consistently look for ways to improve workflows, increase leverage, and achieve more with fewer hands.\n* A positive, can-do, adventurer mindset. You are a fast learner who is happy to dive into unfamiliar problems and figure things out along the way.\n* Hands-on experience with AI tools and a strong interest in agentic workflows.\n* Excellent communication skills: you can explain complex ideas simply, facilitate alignment, and confidently engage with customers and experts.\n* Direct, low-ego communication and collaboration style.\n\n*Bonus points*\n--------------\n\n* Background in FinOps, observability or infra.\n\n*How success will be measured*\n\n* The Attribute roadmap advances through frequent, high-quality releases with clear customer value.\n* Customer feedback loops are strong: you can show how insights translated into shipped improvements.\n* Adoption and outcomes improve measurably, including usage, engagement, workflow completion, reliability, cost impact, and customer impact.\n* The Engineering team consistently has clarity on the next most valuable increment to build—and why.\n* The team uses AI and automation thoughtfully to increase its leverage without compromising quality, safety, or customer trust.\n\n*Are you a Do’er?*\n\nBe your truest self. Work on your terms. Make a difference.\n\nWe are home to a global team of incredible talent who work remotely and have the flexibility to have a schedule that balances your work and home life. We embrace and support leveling up your skills professionally and personally.\n\nWhat does being a Do’er mean? We’re all about being entrepreneurial, pursuing knowledge, and having fun! Click here to learn more about our core values.\n\nSounds too good to be true? Check out our Glassdoor Page.\n\nWe thought so too, but we’re here and happy we hit that ‘apply’ button.\n\nFull-time employee benefits include:\n\n* Unlimited vacation\n* Health insurance\n* Parental leave\n* Employee stock option plan\n* Professional development stipend\n* Peer recognition program\n\n*Many Do’ers, One Team*\n\nDoiT unites as Many Do’ers, One Team, where diversity is more than a goal—it’s our strength. We actively cultivate an inclusive, equitable workplace, recognizing that each unique perspective enhances our innovation. By celebrating differences, we create an environment where every individual feels valued, contributing to our collective success.", "language": "en", "documents": [{"url": "cv/274f721d3210ccf34cc1a4e0170effee908c895df021bd1db33dbca0c0ed49ef.pdf", "filename": "doit__technical-product-manager-attribute__30b1e340__tailored_cv_final.pdf", "kind": "other", "primary": true}]}, {"id": "J-b069ef3b3084ac4d605571a3", "organization": "Bank of Montreal", "title": "Manager, Credit Risk Model Validation", "a": 4, "b": 3, "alternative": false, "description": "Application Deadline:\n\n08/30/2026\n\nAddress:\n\n100 King Street West\n\nJob Family Group:\n\nAudit, Risk & Compliance\n\nSeeking a skilled and experienced professional to join our Model Risk Management Team as a Manager, Model Risk, Credit Risk. As a manager in our second line of defense risk management, governance, and control function, you will play a pivotal role in the validation of credit risk models, such as Allowance (IFRS 9 /CECL/loss forecasting) models, Stress Testing (CCAR/EWST), Climate Risk models and other initiatives. Other activities related to the model lifecycle such as model performance monitoring, annual reviews, assessment of overlay quantification are also part of the validation responsibilities. Experience in other credit risk families, such as credit adjudication and account management models, is also relevant. This is an individual contributor role.\n\nNote- We welcome applications from Senior Analyst candidates with fewer years of experience, provided they have a strong technical background and experience that is closely aligned with the role\n\nKey Role Responsibilities:\n\n* Model Risk Review and Effective Challenge: You perform the validation of models, other estimation approaches and critical tool calculators and assess the model risk to confirm model appropriateness and capability for a designated portfolio. You are responsible for providing effective challenge to the credit risk models during model development and communicating decisions regarding model use to the business to ensure transparency and understanding of models and model risks. You assess the models’ capabilities, stress points and limitations; you assess the associated model risk and the controls in place to mitigate identified risks.\n* Stakeholder Engagement: Effective communication is crucial in this role. You will manage relationships with model developers, owners, and users, influencing and advising on model risk-related matters. Your ability to explain complex technical concepts in everyday language will set you apart.\n* Change Management: BMO is at the forefront of innovation in model risk management. You will be part of the team that drives change by embracing new technology platforms, tools, and operating models.\n* Regulatory Expertise: Acts as a subject matter expert on relevant regulations and policies. May network with industry contacts to gain competitive insights and best practices. Interprets new regulations and assesses impacts to the program / portfolio validation framework.\n* Risk Understanding: You will need to connect the dots between technical issues and business considerations.\n\n* Serve as a trusted advisor to business partners, influencing stakeholders and supporting strategic planning and decision-making.\n* Lead the development, execution, and enhancement of the model validation framework, methodologies, and validation strategies.\n* Independently validate models, assumptions, data, methodologies, benchmarks, and supporting documentation to assess model effectiveness and compliance.\n* Identify, quantify, document, and escalate model risks, deficiencies, and required corrective actions while monitoring remediation efforts.\n* Research emerging trends, regulatory requirements, and industry best practices to strengthen model risk management and governance.\n* Provide expert consulting and technical guidance on model validation, risk management, and framework implementation.\n* Lead validation-related initiatives, change management activities, process improvements, and operational programs across the portfolio.\n* Represent the model validation function during internal audits, regulatory examinations, and stakeholder reviews.\n* Develop, monitor, and report on model validation portfolio performance, model inventory, attestations, and governance outcomes.\n* Build and maintain strong stakeholder relationships, ensuring alignment, effective communication, and successful delivery of strategic objectives.\n\n*Qualifications:*\n\n* A MSc or PhD in quantitative fields such as statistics, applied mathematics, financial mathematics, data science, actuarial sciences, electrical engineering, or related fields.\n* A minimum of 4 years of experience in model validation and/or development within a financial institution, particularly in the credit risk area.\n* Certifications: While qualifications like CFA are helpful, they are not mandatory.\n* Experience in credit risk models, including Stress Testing & loss forecasting, AIRB and Adjudication/Account Management.\n* Proficiency in a programming language such as Python, R, and SAS (Python is preferred).\n* Proficiency in working with relational databases – SQL or Oracle.\n* Working with Big data tools and Cloud platforms (AWS/Azure) is a plus.\n* A can-do attitude and a research, deep-dive mindset.\n\nOur team values flexibility, collaboration and in-person engagement. This position is located in Toronto and offers flexibility with a hybrid work arrangement, where the successful candidate will spend at least 3 days per week on-site.\n\n*Salary* *:*\n\n$75,900.00 - $141,900.00\n\n*Pay Type:*\n\nSalaried\n\nThe above represents BMO Financial Group’s pay range and type.\n\nSalaries will vary based on factors such as location, skills, experience, education, and qualifications for the role, and may include a commission structure. Salaries for part-time roles will be pro-rated based on number of hours regularly worked. For commission roles, the salary listed above represents BMO Financial Group’s expected target for the first year in this position.\n\nBMO Financial Group’s total compensation package will vary based on the pay type of the position and may include performance-based incentives, discretionary bonuses, as well as other perks and rewards. BMO also offers health insurance, tuition reimbursement, accident and life insurance, and retirement savings plans. To view more details of our benefits, please visit:\n\n*About Us*\n\nAt BMO we are driven by a shared Purpose: Boldly Grow the Good in business and life. It calls on us to create lasting, positive change for our customers, our communities and our people. By working together, innovating and pushing boundaries, we transform lives and businesses, and power economic growth around the world.\n\nAs a member of the BMO team you are valued, respected and heard, and you have more ways to grow and make an impact. We strive to help you make an impact from day one – for yourself and our customers. We’ll support you with the tools and resources you need to reach new milestones, as you help our customers reach theirs. From in-depth training and coaching, to manager support and network-building opportunities, we’ll help you gain valuable experience, and broaden your skillset.\n\nTo find out more visit us at .\n\nBMO is committed to an inclusive, equitable and accessible workplace. By learning from each other’s differences, we gain strength through our people and our perspectives. Accommodations are available on request for candidates taking part in all aspects of the selection process. To request accommodation, please contact your recruiter.\n\nNote to Recruiters: BMO does not accept unsolicited resumes from any source other than directly from a candidate. Any unsolicited resumes sent to BMO, directly or indirectly, will be considered BMO property. BMO will not pay a fee for any placement resulting from the receipt of an unsolicited resume. A recruiting agency must first have a valid, written and fully executed agency agreement contract for service to submit resumes.", "language": "en", "documents": [{"url": "cv/e01b6498bce8a14cf193f2ed2b5d6d8f85e925bfe81f1e26d57888e289e81932.pdf", "filename": "bank-of-montreal__manager-credit-risk-model-validation__6b5b628f__tailored_cv_final.pdf", "kind": "other", "primary": true}]}, {"id": "J-d52a79305a957edc1f862941", "organization": "Numerica Credit Union", "title": "Credit Risk Analyst", "a": 3, "b": 3, "alternative": false, "description": "Description\n\n*** This job will close on Friday, July 10th at 5 p.m. Pacific Time***\n*Credit Risk Analyst*\n\n*Department: Credit Administration*\n\n*Non-Exempt, Range 12: $36.76 an hour to $55.15 an hour*\n\n*Report To: SVP Credit Administration*\n\n*SUMMARY:*\n\nWith the goal of enhancing lives, fulfilling dreams and building communities this position performs complex financial analysis, responsible for managing the Current Expected Credit Losses (CECL) and loan stress testing models and reporting requirements. This position is also responsible for credit risk reporting, policies, and procedures.\n\n*ESSENTIAL DUTIES AND RESPONSIBILITIES* include the following. Other duties may be assigned.\n\n* To perform this job successfully, an individual must be able to perform each essential duty satisfactorily. Reasonable accommodations may be made to enable individuals with disabilities to perform the essential functions.\n* Performs complex financial analysis. Analyzes, interprets and communicates CECL and loan stress testing model results to management. Strong knowledge of credit risks and metrics.\n* Own models including assumptions, portfolio segmentation decisions, and results calculations. Creation and ongoing maintenance of all CECL and loan stress testing related documentation: desktop procedures, policies, etc.\n* Primary interface for internal and external parties on CECL and loan stress testing, including auditors and regulators. Generates all related reporting for internal stakeholders.\n* Manages CECL Qualitative Adjustment calculations.\n* Partners with Numerica’s lending and credit teams to understand business practices related to Qualitative factor categories and ratings.\n* Partner with Accounting, Organizational Data Management, and IT to ensure necessary data is available, accurate, and internal protocols are being followed.\n* Responsible for ongoing model risk management.\n* Point of contact for economic data, assumptions, and forecasts utilized in Numerica’s CECL model.\n* Create reports from the data warehouse and other databases.\n* Maintains knowledge and adheres to all BSA regulations and compliance standards on internal and external policies.\n* Effectively incorporates concepts of CARES Principles in daily behaviors and interactions:\n\n*Connect* – Create meaningful relationships\n\n*Ask* – Be intentionally curious\n\n*Resolve* – Actively seek solutions\n\n*Elevate* – Never stop improving\n\n*Strengthen* – Be the difference\n\n*SUPERVISORY RESPONSIBILITIES:*\n\nThis position has no formal, direct supervisory responsibilities although will work with leaders and peers in the organization to drive results.\n\n*PERFORMANCE STANDARDS:*\n\nContributes to the organization's mission statement and goals by providing the highest quality of service, treating each person professionally - with warmth, courtesy, and respect, and making a personal effort to make members feel they belong and are important to the credit union.\n\nAll reporting must be accurate, in balance, prepared on a timely basis, and in accordance with generally accepted accounting principles and applicable regulation. Must be able to communicate well with other credit union employees and demonstrate leadership ability. A professional attitude and appearance is vital to the success of this position.\n\n*EDUCATION and/or EXPERIENCE:*\n\nBachelors degree plus four to six years’ experience, or equivalent years of experience and education. The ability to communicate verbally and in writing with others is essential. Technical proficiency in Excel (formulas and pivot tables) is preferred. Previous experience with CECL is preferred.\n\n*CERTIFICATES, LICENSES, REGISTRATIONS:*\n\nNone required.\n\n*SKILLS and ABILITIES:*\n\nAbility to solve practical problems and deal with a variety of concrete variables in situations where limited standardization exists. Ability to operate a personal computer. Familiarity with bank or credit union accounting terminology, standards and acronyms is helpful. Ability to lift up to 25lbs.\n\nA significant level of trust and diplomacy is required, in addition to normal courtesy and tact. Outside contacts become important and fostering sound relationships with other entities, companies and/or individuals, becomes necessary.\n\nAbility to read, analyze, and interpret general business periodicals, professional journals, technical procedures, or governmental regulations. Ability to effectively write reports, business correspondence, procedure manuals and e-mails.\n\nDisclaimer: The job description does not imply an employment contract, nor is it intended to include every duty, task or instruction for which the employee is responsible. Other tasks may be assigned, based on business need and at Management’s request.\n\n*Learn more about our Benefits and Perks here-*\n\nhttps://www.numericacu.com/globalassets/images/pdfs/employee-benefits-summary-numerica.pdf\n\nRequirements\n\n*Numerica Credit Union is an Equal Opportunity/Affirmative Action Employer*\n\nNumerica Credit Union provides equal employment opportunities to all employees and applicants for employment and prohibits discrimination and harassment of any type without regard to race, color, religion, age, sex, national origin, disability status, genetics, protected veteran status, sexual orientation, gender identity or expression, or any other characteristic protected by federal, state or local laws.\n\nIf you are a qualified individual with a disability or a disabled veteran, you have the right to request a reasonable accommodation for purposes of participating in the application/hiring process with Numerica Credit Union. If you are unable or limited in your ability to use or access Numerica Credit Union’s career page at www.numericacu.com as a result of your disability, you can request reasonable accommodations by calling your recruiter.", "language": "en", "documents": [{"url": "cv/cbfe8bf7c74cfe20fb7c506cf2deae965a128a785555213ef3d9b17354087049.pdf", "filename": "numerica-credit-union__credit-risk-analyst__f568bd26__tailored_cv_final.pdf", "kind": "other", "primary": true}]}, {"id": "J-db1fc0f72d27bd72b76c73f8", "organization": "Pagaya", "title": "Senior Product Manager", "a": 4, "b": 2, "alternative": false, "description": "About Pagaya\nPagaya is a global technology company making life-changing financial products and services available to more people nationwide, as it reshapes the financial services ecosystem. By using machine learning, a vast data network and a sophisticated AI-driven approach, Pagaya provides comprehensive consumer credit and residential real estate solutions for its partners, their customers, and investors. Its proprietary API and capital solutions integrate into its network of partners to deliver seamless user experiences and greater access to the mainstream economy. Pagaya has offices in New York and Tel Aviv. For more information, visit pagaya.com.\nAbout the Role:\nAs a Senior Product Manager, your role would involve end to end product management ownership, a combination of product discovery, PRD & tickets creation, communication, execution, working closely with engineering, research, analysts & partners teams. You would be responsible for driving the execution of the relevant engineering group and delivery of platform solutions that support the organization’s initiatives.\nResponsibilities\nCollaborate with stakeholders to define requirements, product requirements and roadmap for Pagaya platform, aligning it with the company’s overall goals and objectives.\nLead the development and delivery of Pagaya underwriting infrastructure solutions, working closely with engineering teams, ensuring the timely execution of projects and adherence to quality standards.\nDefine and track key performance indicators (KPIs) to measure the effectiveness and impact of infrastructure solutions, making data-driven decisions for continuous improvement.\nCommunicate regularly with internal and external stakeholders, providing updates on the progress of projects, addressing their concerns, and managing expectations.\nRequirements\nAt least 5 years experience as a product management.\nSoftware Engineering background.\nExperience with API, cloud services, CI/CD technologies and infrastructure.\nExcellent written and verbal communication skills, with the ability to effectively communicate complex technical concepts to both technical and non-technical stakeholders.\nAbility to communicate effectively and create alignment with external stakeholders\nProven ability to lead cross- functional teams, collaborate effectively, and drive consensus among diverse groups of stakeholders.\nAbility to thrive in a fast-paced, dynamic environment and adapt to changing priorities and requirements.\nOur Team\nPagaya was founded in 2016 by seasoned research, finance, and technology entrepreneurs, and we are now 500+ strong in New York, Los Angeles, and Tel Aviv.\nWe move fast and smart, identifying new opportunities and building end-to-end solutions from AI models and unique data sources. Every Pagaya team member is solving new and exciting challenges every day in a culture based on partnership, collaboration, and community.\nJoin a team of builders who are working every day to enable better outcomes for our partners and their customers.\nOur Values\nOur values are at the heart of everything we do. We believe great solutions are built through a great community.\nAdvance Inclusion- We create a world where everyone can win, designing systems that better represent people and generate sustainable value for our employees, partners and investors.\nBe Accountable Together- We proudly own our actions and our results, taking initiative to ensure our work gets over the finish line as a team.\nContinuously Learn- We challenge ourselves for the sake of getting better as individuals, as teams, and as an organization to deliver for our partners.\nDebate and Commit- We respectfully and openly debate to strengthen our ideas and build shared conviction - once we decide, we go all in, together.\nDream Big and Act- We boldly tackle complex problems, pressure-test solutions in real-time, and adapt with speed and energy.\nMore than just a job\nWe believe health, happiness, and productivity go hand-in-hand. That's why we're continually looking to enhance the ways we support you with benefits programs and perks that allow every Pagayan to do the best work of their life.\nPagaya is an equal opportunity employer. Pagaya is encouraging diversity and actively seeking applicants from all backgrounds, as are committed to creating a diverse workforce together with an inclusive environment for all. Employment is decided on the basis of qualifications, skills, and business needs.\nhttps://pagaya.com/privacy-policy", "language": "en", "documents": [{"url": "cv/d739d722dc2620c278cb0485ae14ffa649a2a3bfe3f0fad6bbafdb3dea7c84ee.pdf", "filename": "pagaya__senior-product-manager__63c0bd31__tailored_cv_final.pdf", "kind": "other", "primary": true}]}, {"id": "J-ee64ab41d986791b2bcc0a27", "organization": "Salesforce", "title": "Deployment Strategist", "a": 5, "b": 3, "alternative": false, "description": "[Apply](https://salesforce.wd12.myworkdayjobs.com/External_Career_Site/job/Israel---Tel-Aviv/Deployment-Strategist_JR348976/apply?source=LinkedIn_Jobs)\nremote type\nOffice - Flexible\nlocations\nIsrael - Tel Aviv\ntime type\nFull time\nposted on\nPosted 30+ Days Ago\njob requisition id\nJR348976\nTo get the best candidate experience, please consider applying for a maximum of 3 roles within 12 months to ensure you are not duplicating efforts.\n\nJob Category\nSales\n\nJob Details\n\nAbout Salesforce\nSalesforce is the #1 AI CRM, where humans with agents drive customer success together. Here, ambition meets action. Tech meets trust. And innovation isn’t a buzzword — it’s a way of life. The world of work as we know it is changing and we're looking for Trailblazers who are passionate about bettering business and the world through AI, driving innovation, and keeping Salesforce's core values at the heart of it all.\n\nReady to level-up your career at the company leading workforce transformation in the agentic era? You’re in the right place! Agentforce is the future of AI, and you are the future of Salesforce.\n\nSalesforce is hiring Deployment Strategists — Strategic Builders who are customer-facing advisors, who define AI strategy, shape agentic solutions, and drive measurable adoption for enterprise customers. You'll work as part of a delivery team alongside Forward Deployed Engineers, translating complex business challenges into agentic AI deployments that go live and generate real value. Engagements are focused and time-bound — typically 12 weeks or less — and may span a single strategic account or multiple customers simultaneously. Your impact isn't just getting to deployment. It ensures customers realise lasting, scalable value from the solutions your team builds.\n\n- Full Lifecycle Ownership: Lead end-to-end customer engagement across the complete value lifecycle — Identify → Commit → Deploy → Consume — owning outcomes at every stage, not just discovery or deal closure\n- AI Strategy & Architecture: Define the customer's Agentic AI strategy and roadmap. Lead design workshops, agent design sessions, and jobs-to-be-done analysis. Architect solutions spanning Salesforce's agentic AI platform, Data Cloud, and enterprise systems, with responsible AI governance baked in from the start.\n- Deployment Oversight & Program Management: Manage engagement delivery end-to-end timelines, stakeholder communication, risk escalation, and progress reporting. You are the operational backbone of your delivery team, ensuring nothing falls through the cracks.\n- Adoption & Consumption: Own adoption, consumption, and expansion metrics within your engagement scope. Identify blockers early and develop strategies to drive measurable value realization\n- Delivery Team Coordination: Partner closely with the Forward Deployed Engineers on your team to align strategy with technical execution. Keep the team focused, unblocked, and on track to hit delivery milestones.\n- AI-Supported Development: You'll be developing real customer solutions supported by leading-edge AI tools: Including \n- Cursor, Claude, and our coding products like Vibes, to accelerate development.  \n- Customer Stakeholder Management: Serve as the primary customer-facing contact, building trust-based relationships with senior stakeholders and present proposals, decisions and outcomes in terms of business value, not just technical detail. \n- AI Readiness: Assess customer readiness for AI adoption and guide change management and process transformation to maximise the benefits of intelligent agents\n- Product Feedback Loop: Synthesise field insights and translate them into actionable product feedback that influences Salesforce's Agentic AI platform roadmap.\n\n- 4+ years experience in strategic solutioning, technical advisory, or delivery leadership or programme management for enterprise cloud or SaaS technology\n- You have a degree in Computer Science or a related field\n- Prior customer-facing delivery experience (consulting, professional services, or technical advisory) - this is a requirement, not a nice-to-have\n- Demonstrated understanding of the Salesforce platform and ecosystem, including Agentic AI capabilities and Data Cloud\n- Working knowledge of one or more programming languages: Python, JavaScript, Java, or Apex\n- Proven ability to lead and own complex, ambiguous engagements end-to-end — from discovery through to measurable outcomes\n- Experience leading AI/LLM solution design, including agentic AI strategy, conversation design, and responsible AI practices\n- Strong project and programme management skills — ability to run multiple workstreams, manage stakeholder expectations, and keep delivery on track in ambiguous environments\n- Ability to travel 25% of the time to customer sitesֿ\n- High level of proficiency in Hebrew and English\n\n- Experience with Salesforce Data Cloud, Agentforce platform, and Salesforce CRM (Sales, Service, Marketing)\n- Experience designing and deploying AI solutions in regulated industries (e.g., public sector, financial services, healthcare)\n- Salesforce platform certifications (e.g., Data Cloud Consultant, Agentforce Specialist, Application Architect) or similar platform certifications such as Microsoft, Oracle, or similar platforms.\n- Background in change management, organisational design, or enterprise transformation\n- Experience with AI/ML concepts beyond LLMs, including NLP, RAG architectures, and model evaluation frameworks\n- A get-things-done mindset with strong bias for action — comfortable operating in unstructured fast moving environments \n\nUnleash Your Potential\nWhen you join Salesforce, you’ll be limitless in all areas of your life. Our benefits and resources support you to find balance and be your best, and our AI agents accelerate your impact so you can do your best. Together, we’ll bring the power of Agentforce to organizations of all sizes and deliver amazing experiences that customers love. Apply today to not only shape the future — but to redefine what’s possible — for yourself, for AI, and the world.\n\nAccommodations\nIf you need a reasonable accommodation during the application or the recruiting process, please submit a request via this [Accommodations Request Form](https://careers.mail.salesforce.com/accommodations-request-form?_ga=2.139086459.912759425.1690463420-976932181.1684251251).\n\nPlease note that Salesforce uses artificial intelligence (AI) tools to help our recruiters assess and evaluate candidates’ resumes and qualifications throughout the recruiting process. Humans will always make any candidate selection and hiring decisions. Please see our [Candidate Privacy Statement](https://www.salesforce.com/en-us/wp-content/uploads/sites/4/documents/legal/Privacy/salesforce-candidate-privacy-statement-december-2024.pdf) for more information about how we use your personal data and your rights, including with regard to use of AI tools and opt out options.\n\nPosting Statement\nSalesforce is an equal opportunity employer and maintains a policy of non-discrimination with all employees and applicants for employment. What does that mean exactly? It means that at Salesforce, we believe in equality for all. And we believe we can lead the path to equality in part by creating a workplace that’s inclusive, and free from discrimination. [Know your rights: workplace discrimination is illegal.](https://www.eeoc.gov/know-your-rights-workplace-discrimination-illegal) Any employee or potential employee will be assessed on the basis of merit, competence and qualifications – without regard to race, religion, color, national origin, sex, sexual orientation, gender expression or identity, transgender status, age, disability, veteran or marital status, political viewpoint, or other classifications protected by law. This policy applies to current and prospective employees, no matter where they are in their Salesforce employment journey. It also applies to recruiting, hiring, job assignment, compensation, promotion, benefits, training, assessment of job performance, discipline, termination, and everything in between. Recruiting, hiring, and promotion decisions at Salesforce are fair and based on merit. The same goes for compensation, benefits, promotions, transfers, reduction in workforce, recall, training, and education.", "language": "en", "documents": [{"url": "cv/d71c6cdd5cfc7e3d947d6bd89af6a6d50dbd7abc6e65d09ef970f8e98f3f3824.pdf", "filename": "Yehuda_Raanan_Salesforce_Deployment_Strategist_CV.pdf", "kind": "annotated", "primary": true}, {"url": "cv/3d2f809d0cdde0e1f939969c4b12343f1baab261a5ee5de80f12129cd2c37907.pdf", "filename": "Yehuda_Raanan_Salesforce_Deployment_Strategist_CV_Clean.pdf", "kind": "clean", "primary": true}]}, {"id": "J-ffc762bb93c1852281cf4ffa", "organization": "Bluevine Israel", "title": "Lead Software Engineer (Potential to Grow into Team Leadership)", "a": 4, "b": 1, "alternative": false, "description": "\n\nAbout Bluevine\n\nBluevine is the largest small business banking platform in the U.S., redefining how entrepreneurs manage their money. We create modern financial solutions, from checking and lending to payments and beyond, designed to help small business owners grow, thrive, and take control of their financial future. Our best-in-class technology, advanced security, and deep understanding of the small business community give our customers the confidence to focus on what they do best.\n\nSince 2013, we’ve supported more than 750,000 small businesses nationwide. Backed by leading investors like Lightspeed Venture Partners, Menlo Ventures, 83North, and Citi Ventures, our 500+ person global team shares one mission: to give small businesses the financial tools they need to succeed.\n\nWe’re innovators driven by big ideas, collaboration, and real impact. Here, you’ll have the freedom to take ownership, grow your career, and make a difference for small business owners across America. Ready to shape what’s next?\n\n## About the Role\n\nAt Bluevine, we're building the next generation of AI-powered engineering capabilities to accelerate innovation across the company. As a Lead Engineer, you'll play a key role in shaping our backend architecture, AI platform, and internal developer tooling while solving complex engineering challenges at scale.\n\nThis is a highly autonomous, hands-on technical leadership role where you'll influence architecture, drive strategic technical initiatives, and help engineering teams adopt modern AI workflows responsibly and effectively. You'll collaborate closely with cross-functional teams and mentor engineers through technical leadership, design reviews, and hands-on implementation.\n\nAs the organization grows, there may be opportunities to take on people management responsibilities, depending on business needs and your career aspirations. Whether you continue growing as a senior technical leader or move into engineering management, you'll have the opportunity to make a significant impact across the organization.\n\nWhat You Will Do\n\n- Lead the design and development of scalable backend services and core platform capabilities that solve complex architectural and distributed systems challenges.\n\n- Build proprietary AI-powered internal tools and standardize backend infrastructure to improve engineering productivity across teams.\n\n- Drive technical strategy for AI-enabled engineering solutions, establishing best practices around reliability, security, privacy, observability, and cost efficiency.\n\n- Lead complex technical initiatives from design through production, partnering closely with Product, Data, Risk, and Infrastructure teams.\n\n- Provide technical leadership through architecture reviews, code reviews, mentoring, and hands-on software development.\n\n- Influence engineering standards, technical direction, and long-term platform strategy across multiple teams.\n\n- Define engineering processes, execution plans, and technical approaches for high-impact initiatives.\n\n- Build internal platforms, frameworks, and infrastructure that enable other Bluevine engineering teams to deliver faster and more reliably.\n\n- Evaluate emerging AI technologies and identify practical opportunities to improve software development workflows.\n\nWhat We Are Looking For\n\n- 8+ years of backend software engineering experience with a Bachelor's degree (or 6+ years with a Master's degree).\n\n- Proven experience leading complex technical initiatives and mentoring engineers as a Tech Lead, Lead Engineer, or similar role.\n\n- Strong Python development skills and deep expertise in distributed systems design.\n\n- Extensive experience building scalable cloud-based systems, APIs, databases, and production services.\n\n- Hands-on experience using AI development tools such as GitHub Copilot, Cursor, ChatGPT, or Claude to improve engineering workflows.\n\n- Strong understanding of modern LLM application architectures, including prompt management, structured outputs, tool/function calling, agentic frameworks, and semantic routing.\n\n- Experience working with vector databases (such as Pinecone, Milvus, or pgvector), event streaming platforms (Kafka or RabbitMQ), and modern AI frameworks such as AWS Bedrock AgentCore or MCP.\n\n- Ability to evaluate AI solutions from an engineering perspective, considering scalability, security, privacy, latency, reliability, maintainability, and cost.\n\n- Strong communication and collaboration skills with a demonstrated ability to influence technical decisions across teams.\n\n- Self-driven, pragmatic, and comfortable operating in ambiguous, fast-moving environments.\n\nNice to Have\n\n- Experience with CI/CD pipelines, Infrastructure as Code, observability, and production operations.\n\n- Experience in fintech, banking, payments, compliance, fraud, or other regulated environments.\n\n- Experience with Big Data technologies such as Apache Spark, Flink, AWS EMR, Databricks, Snowflake, or Apache Iceberg.\n\n- Background in Data Science, Machine Learning Engineering, or MLOps, with familiarity in model training pipelines, evaluation metrics, feature engineering, and statistical modeling.\n\nWhat Success Looks Like\n\n- You build highly reliable, scalable backend platforms that accelerate engineering productivity and support the company's strategic goals.\n\n- You become a trusted technical leader, driving architectural decisions and influencing engineering best practices across the organization.\n\n- You successfully lead complex cross-functional initiatives from concept through production.\n\n- You mentor engineers, helping raise the technical bar across the team.\n\n- As the organization evolves, you may also have opportunities to expand your impact through people leadership, depending on business needs and your career aspirations.\n\n- You foster collaboration, ownership, and technical excellence while embodying Bluevine's engineering values.\n\n##  \n\nBenefits & Perks\n\n- Excellent group health coverage\n\n- Stock options\n\n- Flexible hybrid work model\n\n- Large Study Fund contribution\n\n- Salary Benchmarks and Checkpoints \n\n- Monthly meal card of TenBis or CiBus (your choice) with generous balance\n\n- Free parking for cars, scooters, and bikes\n\n- Free gym membership\n\n- Company-sponsored Mental Health Benefits\n\n- PTO, Company Holidays, and Flexible Holidays\n\n- Community-based volunteering opportunities\n\n", "language": "en", "documents": [{"url": "cv/e8bab5b2850f552302bdc62118999c66eb94f227733599811a0e3aff79be32c2.pdf", "filename": "bluevine-israel__lead-software-engineer-potential-to-grow-into-team-leadershi__313c825e__tailored_cv_final.pdf", "kind": "other", "primary": true}]}, {"id": "PJ-1bb6f70a8358860260a93845", "organization": "monday.com", "title": "AI Enablement Solutions Manager", "a": 4, "b": 3, "alternative": false, "description": "is the AI work platform powering the most ambitious teams. 250,000+ customers across departments use us to bring people, workflows, and AI agents together on one flexible platform where AI doesn't just assist, it executes. We move fast, build things that matter, and foster an ownership-driven culture where you're empowered to shape how organizations work and outpace their competition.\n\n*Enabling our teams in this new era requires a genuinely different approach. We're setting out to pioneer enablement that's innovative, hands-on, and deep enough to actually change how teams work — not just add another course to the pile. Come help us define and build it.*\n\nis becoming an AI Work Platform, and our mission is to lead that shift through how people learn, consume knowledge, and become true platform and business experts. This role builds the AI-first solutions that make that possible.\n\n*About The Role*\n\n* \n\nBuild enablement solutions through innovative, engaging, AI-first tools and content.\n\n* \n\nThink about how teams consume knowledge and learn, and build smart solutions that help them learn effectively in the AI era.\n\n* \n\nBuild engaging AI content that addresses key product and business knowledge — agents, pricing, and beyond.\n\n* \n\nMove at build speed — turn a business problem into a working prototype in days, then iterate from real usage.\n\n* \n\nGo deep on monday's product and the business mindset behind each problem, so what you build is grounded in what's actually true, not just what's documented.\n\n* \n\nShip everything as a product — real users, a feedback loop, a next iteration. Nothing built once and abandoned.\n\n* \n\nLead and deliver sessions yourself on what you build. This is a hands-on role — you don't hand delivery off to someone else.\n\n* \n\nWork constantly across stakeholders to bridge business and product gaps — Product and Engineering, Client-Facing teams, and the wider CCO.\n\n*Requirements*\n\n* \n\n3+ years of experience in Customer Success, Technical Enablement, Solution Engineering, Technical Account Management (TAM), or Customer Engineering within a fast-paced B2B software environment\n\n* \n\nStrong customer-facing and business understanding — you know how to diagnose what's actually blocking a team or customer, not just take a content request at face value.\n\n* \n\nStrong AI fluency — proven, hands-on experience building AI solutions (Claude, LLMs, agents, no-code tooling, monday's own AI products) that reduced manual effort, improved consistency, or otherwise addressed a real business need.\n\n* \n\nBuilder mindset — highly proactive and action-oriented, quick to ship rather than wait for a spec or a green light.\n\n* \n\nStrong communication skills, written and spoken — you can explain what you built clearly to technical and non-technical audiences alike.\n\n* \n\nA genuine passion for enabling people and sharing knowledge. Instructional design experience is a bonus, not a requirement.\n\n* \n\nComfort working project-based — dropping into an unfamiliar business problem, ramping fast, and moving on once it's solved.\n\n* \n\nA hungry, high-ownership drive to make visible impact — motivated by building things that matter and move the needle.\n\n*What* *can offer you:*\n\n* \n\nJoin a customer-obsessed team where transparency and ownership are how we actually operate - not just things we put on a wall\n\n* \n\nWork on a multi-product suite powered by advanced AI, where what you ship reaches hundreds of thousands of customers worldwide\n\n* \n\nCompetitive salary, benefits, bonus potential, and equity eligibility for many roles — we believe people should share in our success\n\n* \n\nGrow fast through a dedicated L&D team, AI workshops, bootcamps, and internal hackathons - the industry moves quick and so do we\n\n* \n\nA collaborative, global culture backed by Employee Resource Groups and workplace teams across New York, Tel Aviv, London, Munich, Warsaw, Tokyo, Sydney, and more", "language": "en", "documents": [{"url": "cv/bcf5a5814f2f886c288e4bb99e763d8f4d47dc83efd38373c6abafe8b1aac9cb.pdf", "filename": "Yehuda_Raanan_monday_AI_Enablement_Solutions_Manager_CV.pdf", "kind": "annotated", "primary": true}, {"url": "cv/5c6468e38e799a7d32724470f77a021b2d2201f8600567ab35e3267ad590650e.pdf", "filename": "Yehuda_Raanan_monday_AI_Enablement_Solutions_Manager_CV_Clean.pdf", "kind": "clean", "primary": true}]}, {"id": "PJ-262795204bbb6864f5bd9359", "organization": "Cyera", "title": "Emerging Products", "a": 4, "b": 3, "alternative": false, "description": "*About Cyera*\n\nCome join the company building the security operating model for the age of AI. AI has changed how data is used — and security must change with it. Cyera's mission is to empower businesses to accelerate AI Adoption by defining a holistic approach to securing AI - from data to access to model. Instead of perimeter controls and static policies, Cyera provides a unified control plane that understands relationships between data, access, and behaviors across humans, systems, and AI. Backed by the world’s leading investors and working with a large and growing list of Fortune 1000 companies, we are looking for world-class talent to join us as we usher in the new era of data and AI security.\n\n*About the Team*\n\nEarlier this year, Cyera established an entirely new group with a singular focus: Enabling our customers to safely adopt AI. Not just secure AI use after the fact - but discover it, govern it, and protect it end to end. The AI Security group operates like a startup within Cyera. You'll join this group as we define what enterprise-grade AI security looks like from scratch.\n\nIf you’re passionate about the intersection of AI and data security and thrive in an agile, fast-moving environment, this is the place to make an impact.\n\n*About the Role*\n\nWe’re looking for a skilled and strategic Solution Architect to join our AI Security group. In this role, you’ll own complex customer projects, bridge the gap between the field, R&D and PM. You’ll work closely with internal teams and customers to address technical challenges, enhance our platform’s capabilities, and drive successful customer implementation and outcomes. Your work will directly influence product evolution, customer adoption, and enable scalable success across the organization.\n\n*What You’ll Do*\n\n* Act as the *technical point of contact* and lead complex customer engagement projects across pre-sale and post-sale efforts.\n* Partner with internal teams and customers to implement and integrate Cyera’s AI Sec solutions, ensuring technical feasibility and alignment with business needs.\n* Act as a platform expert, collaborating with Product and Engineering teams to translate customer challenges into new features and technical solutions.\n* Troubleshoot complex technical issues, working with cross-functional teams to resolve challenges quickly and effectively.\n* Collaborate closely with Sales, Customer Success, Product Management and R&D to accelerate the sales process, manage escalations, and maintain alignment across teams.\n* Design and implement ad-hoc technical solutions and automation to enhance pre-sale, post-sale, and internal operations.\n* Continuously improve internal workflows, tooling, and best practices to support a growing customer base and field team.\n* Drive pre-sales engagements to a technical win and post-sales engagements to success.\n\nRequirements\n------------\n\n*Who You Are*\n\n*Must-Haves*\n\n* Proven experience as a Solution Architect (or similar technical role)\n* Strong background creating technical solutions, systems integrations, and customer-facing technical delivery.\n* Proficiency in querying (e.g., SQL).\n* Strong cloud understanding and experience (at least one of AWS/Azure/GCP).\n* Proven experience with handling complex customer requirements.\n* You excel at problem-solving, capable of analyzing complex systems and processes to develop effective solutions.\n* You are a strong communicator with excellent interpersonal skills, building trust and relationships with customers and internal teams.\n* You thrive in a fast-paced environment, effectively managing multiple priorities and adapting to evolving business needs.\n* Strong ownership mindset - you take initiative, work independently, and thrive in fast-moving environments.\n* Experience collaborating with R&D and Product teams to resolve customer friction and improve product capabilities.\n\n*Nice-to-Haves*\n\n* Background as a software developer\n* Strong understanding of the AI Security space\n* Proven experience developing AI Agents\n* Bachelor's degree in Computer Science, Information Technology, or a related field.\n* Familiarity with automation, scripting, and internal tooling development.\n\n*Why Join Us?*\n\nAt Cyera, we care about collaboration, innovation, and agility. We take “teamwork” seriously—with our inclusive and supportive culture at the forefront—and we’re just as serious about nurturing Cyerans to grow, both personally and professionally.\n\n* **Feel Free to Apply Even if your experience doesn’t tick every box, we encourage you to apply. We’re building something special here—and we welcome Cyerans with diverse backgrounds, perspectives, and experiences.", "language": "en", "documents": [{"url": "cv/8c0aa0eb7b915e9f9cb4ef7645586b4efa6bd86dd3ff79dc225ed7b58db7aa6e.pdf", "filename": "Yehuda_Raanan_Cyera_Emerging_Products_CV.pdf", "kind": "annotated", "primary": true}, {"url": "cv/568198683c658a9a3b3c5e652dda6ef522920483d8af6c09978c556fde488e67.pdf", "filename": "Yehuda_Raanan_Cyera_Emerging_Products_CV_Clean.pdf", "kind": "clean", "primary": true}]}, {"id": "PJ-dc5f7a274882c12615e62a2d", "organization": "Payoneer", "title": "Working Capital", "a": 4, "b": 3, "alternative": false, "description": "About Payoneer\nFounded in 2005, Payoneer is the global financial platform that removes friction from doing business across borders, with a mission to connect the world’s underserved businesses to a rising global economy. We’re a community with over 2,500 colleagues all over the world, working to serve customers, and partners in over 190 countries and territories.\nBy taking the complexity out of the financial workflows–including everything from global payments and compliance to multi-currency and workforce management, to providing working capital and business intelligence–we give businesses the tools they need to work efficiently worldwide and grow with confidence.\nSenior Product Manager | Working Capital (Enterprise Team)\nWhat You’ll Be Spending Your Time On\nOwn the end-to-end Working Capital product strategy and roadmap globally - Capital Advance, Line of Credit, early pay and similar constructs.\nDrive the full credit product lifecycle: eligibility, offer creation, underwriting, disbursement, collections, and repeat/renewal — designing for speed, scale, and trust.\nPartner with Data Science and Risk to shape credit models and risk-based pricing.\nLead geographic and currency expansion and deepen marketplace integrations.\nDefine the north-star and success metrics and run experiments that move them.\nCollaborate across Data, Design, Engineering, Risk, Legal/Compliance, and GTM to translate strategy into shipped business outcomes.\nHave You Done This Kind of Stuff?\nStrong 6+ years of experience delivering fintech, lending/credit, or platform products at scale, end-to-end from discovery to production.\nProven ability to ship data-driven products in close partnership with Data Science and Risk (models, underwriting, pricing).\nStrong product sense and systems thinking across eligibility, offers, decisioning, and platform/API design.\nFluency with metrics, experimentation, and funnel optimization to drive conversion and retention.\nExperience leading cross-functional squads in Agile product development environments.\nNot a Must, but a Great Advantage\nExperience in NBFC/SMB/embedded lending, working capital, SME credit, or invoice/receivables financing.\nExposure to global payments, cross-border flows, or marketplace ecosystems.\nFamiliarity with credit risk, underwriting, collections, and cross-market regulatory considerations.\nPrior experience scaling products from growth to maturity, and standing up partner or marketplace platforms.\nThe Payoneer Ways of Working\nAct as our customer’s partner on the inside\nLearning what they need and creating what will help them go further.\nDo it. Own it.\nBeing fearlessly accountable in everything we do.\nContinuously improve\nAlways striving for a higher standard than our last.\nBuild each other up\nHelping each other grow, as professionals and people.\nIf this sounds like a business, a community, and a mission you want to be part of, apply today.\nWe are committed to providing a diverse and inclusive workplace. Payoneer is an equal opportunity employer, and all qualified applicants will receive consideration for employment no matter your race, color, ancestry, religion, sex, sexual orientation, gender identity, national origin, age, disability status, protected veteran status, or any other characteristic protected by law. If you require reasonable accommodation at any stage of the hiring process, please speak to the recruiter managing the role for any adjustments. Decisions about requests for reasonable accommodation are made on a case-by-case basis.", "language": "en", "documents": [{"url": "cv/266e353f4e4c13aabb02d2e4a3a2dc0284d6fe9f985cad6503a5eba3a1f557f4.pdf", "filename": "Yehuda_Raanan_Payoneer_Working_Capital_CV.pdf", "kind": "annotated", "primary": true}, {"url": "cv/99ba0d20f46c5198082629896ef4d5a33ebcb566f24db3c6b54da67c7b53f7c1.pdf", "filename": "Yehuda_Raanan_Payoneer_Working_Capital_CV_Clean.pdf", "kind": "clean", "primary": true}]}, {"id": "PJ-e922718376ffe33a7a899673", "organization": "Aidoc", "title": "GenAI Operations", "a": 5, "b": 3, "alternative": false, "description": "*About Aidoc*\n\nAidoc is the market leader in healthcare AI and has developed the world's largest clinical frontier model, supporting nearly 50 million patients each year.\nAidoc is deployed in more than 2,000 medical centers worldwide. Since our founding in 2016, Aidoc has raised over $500 million and achieved a record number of FDA-cleared solutions.\n\nMedical diagnosis is hitting a breaking point, where the number of physicians hasn't kept up with the rapidly growing patient load. This leads to misdiagnosis and treatment delays that result in hundreds of thousands of deaths every year. Aidoc assists clinicians by precisely highlighting diseases directly on medical images, preventing misdiagnosis and ensuring that urgent patients receive the immediate attention they need.\n\nThe Director of GenAI Operations is responsible for driving the adoption, maintaining standards, and ensuring the effective use of AI across Aidoc. This role partners with business and technical stakeholders to identify high-impact opportunities, translate them into scalable AI-enabled workflows, and ensure responsible implementation aligned with company priorities and producing measurable ROI.\n\nThis role combines strategy, execution, enablement, and governance. Director of GenAI Operations will define standards, build repeatable playbooks, support cross-functional adoption, and help employees and teams use AI tools in a practical, measurable, and secure way.\n\nMain roles and responsibilities:\n--------------------------------\n\n* Partner with business leaders to identify, assess, and prioritize AI and automation opportunities across workflows and processes.\n* Hands-on creation of scalable AI-enabled workflows and operating models that align with business needs, available tooling, and business systems.\n* Translate use cases into clear implementation requirements, process definitions, documentation, and success criteria.\n* Build and maintain AI playbooks, standards, usage guidelines, and best practices for employees and teams.\n* Lead enablement activities, including onboarding, workshops, training materials, office hours, and internal knowledge sharing.\n* Drive adoption of approved AI tools and capabilities across the organization, helping teams move from experimentation to sustainable usage.\n* Collaborate with business stakeholders to ensure AI usage aligns with governance, privacy, security, confidentiality, and compliance requirements.\n* Establish feedback loops, reporting, and measurable KPIs for AI adoption, productivity gains, and business outcomes.\n* Monitor external AI trends, vendor capabilities, and emerging practices, and recommend improvements relevant to Aidoc.\n* Support vendor evaluation, tool rationalization, and the rollout of new AI capabilities where needed.\n\nRequirements:\n-------------\n\n* Hands-on technical builder proficient in Python/JS, APIs, GenAI stack (prompts, agents, skills, RAG), and automation tools (n8n, Make, Zapier)\n* Strong business orientation and communication skills – ability to turn ambiguous problems into clear solutions and bridge between business and tech\n* Proven experience in leading cross-functional projects, workflow improvements, or tech adoption initiatives\n* High ownership and proactive problem-solving skills\n\nWorking at Aidoc\n\n*Our Perks:*\n\n* Be part of something big - using cutting-edge technologies to transform the Healthcare industry (while saving patients’ lives)\n* We work in a hybrid model, with our new offices located at 34 HaMasger Street in Tel Aviv and parking for employees.\n* Amazing and healthy breakfasts and lunches prepared daily by our personal chef!\n* Stocked up kitchen & meal card\n* Wellness: Aidoc employees-only gym, plus Pilates, Yoga, and functional workouts classes.\n* Amazing culture - collaborative, transparent & fun!\n* Attractive compensation package & benefits\n\nAidoc is deeply committed to creating an inclusive workplace, and to the principle of equal opportunity for all individuals. We prohibit discrimination and harassment based on race, color, religion, sex, sexual orientation, gender identity, national origin, age, disability, veteran status, or any other status protected by law.", "language": "en", "documents": [{"url": "cv/fe39d1c5a70c31ed9c9ee89b8a78d37efface067307b095044a09d97264af74f.pdf", "filename": "Yehuda_Raanan_Aidoc_GenAI_Operations_CV.pdf", "kind": "annotated", "primary": true}, {"url": "cv/70f39fa8a9d9347962897aca139c1c4ff5e6f5df318ab2b36d4b7aec938a26a0.pdf", "filename": "Yehuda_Raanan_Aidoc_GenAI_Operations_CV_Clean.pdf", "kind": "clean", "primary": true}]}, {"id": "ALT-phd", "organization": "Independent path", "title": "PhD", "a": 5, "b": 3, "alternative": true, "description": "Visible change or lasting capability is attractive. Interesting basic research can also fit without an immediate application.\n\nApplied research is slightly preferred. Reading and ideas are rewarding; repetitive polishing and technical chores are costs.\n\nA doctorate has intrinsic value. A strong research group is preferred. Economic and family justification remain necessary.", "language": "en", "documents": []}, {"id": "ALT-entrepreneurship", "organization": "Independent path", "title": "Entrepreneurship", "a": 4, "b": 3, "alternative": true, "description": "Substantive professional influence is necessary. Method research can provide ownership without production-release authority.\n\nEntrepreneurship requires an interesting problem, meaningful capital, trusted partners, business potential and family security together. Risk alone has no positive value.", "language": "en", "documents": []}, {"id": "ALT-consulting", "organization": "Independent path", "title": "Consulting", "a": 4, "b": 3, "alternative": true, "description": "Internal and external clients are equally acceptable. Substantive participation in the solution matters.\n\nFor self-employment, individuals or small groups are preferred, together with a separate learning and research structure. Organizational problems can be attractive in employment.", "language": "en", "documents": []}, {"id": "ALT-portfolio", "organization": "Independent path", "title": "Portfolio career", "a": 5, "b": 3, "alternative": true, "description": "A mix of consulting and research is strongly preferred. A good full-time role can justify giving up side activities.\n\nContinuing career value matters. Seek a new internal challenge first, then consider a move. A bridge role has no fixed time limit.", "language": "en", "documents": []}]</script>
<script>
(()=>{
 const jobs=JSON.parse(document.getElementById('jobs-data').textContent),map=document.getElementById('job-map'),dialog=document.getElementById('job-detail');
 const A={5:'מושך מאוד',4:'מושך',3:'עניין מעורב'},B={1:'חסם מהותי',2:'מעבר משמעותי',3:'נדרשת בדיקה',4:'בסיס קרוב'};
 const node=(tag,text,cls)=>{const e=document.createElement(tag);if(text)e.textContent=text;if(cls)e.className=cls;return e;};
 let lastButton;
 function cvLink(doc,label,cls){const a=node('a',label,cls);if(!/^cv\/[a-f0-9]{64}\.pdf$/.test(doc.url))throw Error('Invalid CV path');a.href=doc.url;a.target='_blank';a.rel='noopener noreferrer';return a;}
 function description(text,target){
  let list;
  for(const block of text.split(/\n\s*\n/)){
   if(/^(Captured from |Official page:)/i.test(block.trim()))continue;
   for(const line of block.split('\n')){
    const raw=line.trim();if(!raw||/^[-=_]{3,}$/.test(raw)||/^#\s+/.test(raw))continue;
    const value=raw.replace(/^#{2,6}\s+/,'').replace(/\[([^\]]+)\]\(https?:\/\/[^)]+\)/g,'$1').replace(/\*{1,2}([^*]+)\*{1,2}/g,'$1');
    if(/^[-*•▪●]\s+/.test(value)){if(!list){list=node('ul');target.append(list);}list.append(node('li',value.replace(/^[-*•▪●]\s+/,'')));}
    else{list=null;const heading=value.length<110&&(/^#{2,6}\s/.test(raw)||/^\*[^*]+\*$/.test(raw)||/:$/.test(value)||/^(requirements|responsibilities|qualifications|about |what you.ll |what you.ll be |who you are|not a must|the Payoneer ways|working at |דרישות|תיאור התפקיד|תחומי אחריות)/i.test(value));target.append(node(heading?'h3':'p',value));}
   }
   list=null;
  }
 }
 function open(job,button){
  lastButton=button;for(const b of map.querySelectorAll('.role'))b.setAttribute('aria-pressed',String(b===button));
  document.getElementById('job-title').textContent=job.title;dialog.querySelector('.organization').textContent=job.organization;
  dialog.querySelector('.bands').replaceChildren(node('span',A[job.a]),node('span',B[job.b]));
  const cv=dialog.querySelector('.cv-links');cv.replaceChildren();cv.hidden=!job.documents.length;
  if(job.documents.length){cv.append(node('h3','קורות חיים'));const primary=job.documents.filter(d=>d.primary);for(const d of primary)cv.append(cvLink(d,d.kind==='clean'?'קורות חיים · גרסה נקייה':d.kind==='annotated'?'קורות חיים · עם הערות':'פתיחת קורות חיים','cv-link'));const additional=job.documents.filter(d=>!d.primary);if(additional.length){const more=node('details',null,'cv-more');more.append(node('summary','גרסאות נוספות'));for(const d of additional)more.append(cvLink(d,d.filename,'cv-version'));cv.append(more);}}
  const article=dialog.querySelector('.description');article.replaceChildren();article.lang=job.language;article.dir=job.language==='he'?'rtl':'ltr';description(job.description,article);
  dialog.showModal();dialog.scrollTop=0;dialog.querySelector('.close').focus();
 }
 for(const a of [5,4,3]){const row=node('tr'),heading=node('th',A[a]);heading.scope='row';row.append(heading);for(const b of [1,2,3,4]){const td=node('td'),cell=node('div',null,'cell'),items=jobs.filter(j=>j.a===a&&j.b===b);if(items.length>10)cell.classList.add('dense');if(!items.length){cell.classList.add('empty');cell.append(node('span','—'));}for(const job of items){const button=node('button',null,'role'+(job.alternative?' alternative':''));button.type='button';button.dataset.id=job.id;button.setAttribute('aria-label',job.organization+' · '+job.title);button.setAttribute('aria-haspopup','dialog');button.setAttribute('aria-pressed','false');button.title=job.organization+' · '+job.title;button.append(node('strong',job.alternative?job.title:job.organization),node('span',job.alternative?'כיוון תעסוקה':job.title));button.addEventListener('click',()=>open(job,button));cell.append(button);}td.append(cell);row.append(td);}map.append(row);}
 dialog.querySelector('.close').addEventListener('click',()=>dialog.close());
 dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});
 dialog.addEventListener('close',()=>lastButton?.focus());
})();
</script></main></body></html>
